/* ============================================================
   PDF EXPORT
   ============================================================ */
/* ------------------------------------------------------------
   PDF export
   1. Lay the quotation out on real A4 pages (794 x 1123 px) in an off-screen stage. This does not depend on the
      window size, the device, or which tab is showing: rows are placed one at a time and never split, the
      table header repeats on every page, the totals stay with the last row, and long terms continue on the next page.
   2. Render each page on its own (small canvases, no giant screenshot).
   3. Write the PDF directly (one full-page JPEG per page), no PDF library needed.
   ------------------------------------------------------------ */
var PDF_PX_W = 794, PDF_PX_H = 1123, pdfBusy = false;
function setBusy(on, text){
  var o = document.getElementById("busyOverlay"); if(!o) return;
  o.classList.toggle("show", !!on);
  if(text){ var t = document.getElementById("busyText"); if(t) t.textContent = text; }
}
function pdfNewPage(stage){
  var page = document.createElement("div");
  page.className = "pdf-page";
  page.innerHTML = '<div class="pdf-frame"><div class="pdf-content"></div><div class="pdf-pageno"></div></div>';
  stage.appendChild(page);
  return {page:page, content:page.querySelector(".pdf-content")};
}
function pdfOverflows(content){ return content.scrollHeight > content.clientHeight + 0.5; }
function waitForImages(root, timeout){
  var imgs = Array.prototype.slice.call(root.querySelectorAll("img"));
  return Promise.all(imgs.map(function(img){
    if(img.complete && img.naturalWidth>0) return null;
    return new Promise(function(res){
      var done = false; function fin(){ if(!done){ done = true; res(); } }
      img.addEventListener("load", fin); img.addEventListener("error", fin); setTimeout(fin, timeout||4000);
    });
  }));
}
/* A row taller than a whole page: shrink its text, and as a last resort clip the description. */
function pdfShrinkRow(row, content, warn){
  for(var fs=12; fs>=7; fs--){ row.style.fontSize = fs+"px"; if(!pdfOverflows(content)) return; }
  var cell = row.querySelector(".desc-cell");
  if(cell){
    var wrap = document.createElement("div");
    wrap.style.overflow = "hidden"; wrap.innerHTML = cell.innerHTML;
    cell.innerHTML = ""; cell.appendChild(wrap);
    var h = Math.max(30, cell.getBoundingClientRect().height - 14);
    for(var t=0; t<10; t++){                                   /* tighten until the whole page really fits */
      wrap.style.maxHeight = Math.floor(h)+"px";
      var over = content.scrollHeight - content.clientHeight;
      if(over <= 0.5) break;
      h = Math.max(30, h - over - 1);
    }
    warn.clipped = true;
  }
}
async function paginateForPdf(P, stage){
  var pages = [], warn = {clipped:false};
  var cur = pdfNewPage(stage); pages.push(cur);
  cur.content.innerHTML = P.header + P.meta;
  await waitForImages(cur.content);
  function newPage(){ cur = pdfNewPage(stage); pages.push(cur); return cur; }
  function startTable(){
    cur.content.insertAdjacentHTML("beforeend", '<table class="doc-table">'+P.colgroup+P.thead+'<tbody></tbody></table>');
    return cur.content.lastElementChild.tBodies[0];
  }
  var tbody = startTable();

  for(var i=0; i<P.rows.length; i++){
    tbody.insertAdjacentHTML("beforeend", P.rows[i]);
    var row = tbody.lastElementChild;
    if(pdfOverflows(cur.content)){
      var firstOnFirstPage = (tbody.children.length===1 && pages.length===1);
      if(tbody.children.length>1 || firstOnFirstPage){
        tbody.removeChild(row);
        if(firstOnFirstPage){ cur.content.removeChild(tbody.parentNode); }
        newPage(); tbody = startTable(); tbody.appendChild(row);
      }
      if(pdfOverflows(cur.content)) pdfShrinkRow(row, cur.content, warn);
    }
  }

  /* totals: never alone at the top of a page if the table has rows to bring along */
  cur.content.insertAdjacentHTML("beforeend", P.totals);
  var tot = cur.content.lastElementChild;
  if(pdfOverflows(cur.content)){
    cur.content.removeChild(tot);
    var lastRow = tbody.lastElementChild;
    if(tbody.children.length>1 && lastRow){
      tbody.removeChild(lastRow); newPage(); tbody = startTable(); tbody.appendChild(lastRow);
    } else { newPage(); }
    cur.content.insertAdjacentHTML("beforeend", P.totals);
    tot = cur.content.lastElementChild;
    if(pdfOverflows(cur.content)){ cur.content.removeChild(tot); newPage(); cur.content.insertAdjacentHTML("beforeend", P.totals); }
  }

  /* general terms: flows item by item onto following pages if needed */
  if(P.termItems.length){
    var sec, ul;
    var open = function(cont){
      cur.content.insertAdjacentHTML("beforeend", P.termsSection([], cont));
      sec = cur.content.lastElementChild; ul = sec.querySelector("ul");
    };
    open(false);
    for(var k=0; k<P.termItems.length; k++){
      ul.insertAdjacentHTML("beforeend", P.termItems[k]);
      var li = ul.lastElementChild;
      if(pdfOverflows(cur.content)){
        ul.removeChild(li);
        var hadItems = ul.children.length>0;
        if(!hadItems) cur.content.removeChild(sec);       /* not even one item fits here: move the whole section */
        newPage(); open(hadItems);
        ul.appendChild(li);
      }
    }
  }

  /* bank details + advance + thank-you line stay together */
  var tail = P.bank + P.footer;
  cur.content.insertAdjacentHTML("beforeend", tail);
  if(pdfOverflows(cur.content)){
    var n = cur.content.children.length, added = [];
    /* remove exactly what we just added (tail may be 1 or 2 elements) */
    var tmp = document.createElement("div"); tmp.innerHTML = tail;
    for(var m=0; m<tmp.children.length; m++){ cur.content.removeChild(cur.content.lastElementChild); }
    newPage(); cur.content.insertAdjacentHTML("beforeend", tail);
  }

  await waitForImages(stage);
  pages.forEach(function(pg, idx){
    pg.page.querySelector(".pdf-pageno").textContent = pages.length>1 ? ("Page "+(idx+1)+" of "+pages.length) : "";
  });
  return {pages:pages, warn:warn};
}

async function pdfRasterize(pageEl, scale){
  var canvas = await window.html2canvas(pageEl, {scale:scale, backgroundColor:"#ffffff", useCORS:true, logging:false,
    windowWidth:PDF_PX_W, windowHeight:PDF_PX_H, scrollX:0, scrollY:0});
  var blob = await new Promise(function(res){ canvas.toBlob(res, "image/jpeg", 0.92); });
  if(!blob) throw new Error("Could not encode page image");
  var out = {bytes:new Uint8Array(await blob.arrayBuffer()), w:canvas.width, h:canvas.height};
  canvas.width = 0; canvas.height = 0;
  return out;
}
async function pdfRasterizeSafely(pageEl, scale){
  var tries = [scale, 2, 1.5], lastErr;
  for(var i=0; i<tries.length; i++){
    try{ return await pdfRasterize(pageEl, tries[i]); }catch(e){ lastErr = e; }
  }
  throw lastErr;
}

function pdfStr(s){
  s = String(s==null?"":s);
  if(/^[\x20-\x7E]*$/.test(s)) return "(" + s.replace(/[\\()]/g, "\\$&") + ")";
  var h = "FEFF"; for(var i=0; i<s.length; i++){ h += ("0000"+s.charCodeAt(i).toString(16)).slice(-4); }
  return "<" + h.toUpperCase() + ">";
}
function pdfDate(d){
  function p(n){ return (n<10?"0":"")+n; }
  return "D:"+d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+"Z";
}
/* Minimal PDF writer: every page is one full-page JPEG on an A4 sheet. */
function buildPdfFromJpegs(pages, meta){
  var enc = new TextEncoder(), chunks = [], offsets = [], len = 0;
  function push(x){ var u = (typeof x==="string") ? enc.encode(x) : x; chunks.push(u); len += u.length; }
  function obj(n){ offsets[n] = len; push(n+" 0 obj\n"); }
  var W = 595.28, H = 841.89, n = pages.length;
  push("%PDF-1.4\n"); push(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  obj(1); push("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  obj(2); push("<< /Type /Pages /Kids ["+pages.map(function(p,i){ return (4+3*i)+" 0 R"; }).join(" ")+"] /Count "+n+" >>\nendobj\n");
  obj(3); push("<< /Title "+pdfStr(meta&&meta.title)+" /Producer (Quotation Builder) /CreationDate ("+pdfDate(new Date())+") >>\nendobj\n");
  pages.forEach(function(p,i){
    var pg = 4+3*i, ct = 5+3*i, im = 6+3*i;
    var content = "q "+W+" 0 0 "+H+" 0 0 cm /Im0 Do Q\n";
    obj(pg); push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /XObject << /Im0 "+im+" 0 R >> >> /Contents "+ct+" 0 R >>\nendobj\n");
    obj(ct); push("<< /Length "+content.length+" >>\nstream\n"+content+"endstream\nendobj\n");
    obj(im); push("<< /Type /XObject /Subtype /Image /Width "+p.w+" /Height "+p.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+p.bytes.length+" >>\nstream\n");
    push(p.bytes); push("\nendstream\nendobj\n");
  });
  var total = 3+3*n, xrefPos = len, x = "xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(var i=1; i<=total; i++) x += String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  push(x);
  push("trailer\n<< /Size "+(total+1)+" /Root 1 0 R /Info 3 0 R >>\nstartxref\n"+xrefPos+"\n%%EOF\n");
  return new Blob(chunks, {type:"application/pdf"});
}

async function exportPDF(){
  var q = getCurrent();
  if(!q){ toast("Create a quotation first."); return; }
  if(pdfBusy) return;
  if(typeof window.html2canvas !== "function"){
    /* The page renderer is loaded from the internet. Offline: fall back to the browser's own Print, which makes a real-text PDF. */
    toast("The PDF engine couldn't load (it needs the internet once). Opening Print: choose “Save as PDF”.");
    doPrint();
    return;
  }
  pdfBusy = true;
  var btn = document.getElementById("pdfBtn"), origLabel = btn.innerHTML, stage = null;
  btn.disabled = true; btn.innerHTML = "Generating…";
  setBusy(true, "Preparing PDF…");
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    stage = document.createElement("div"); stage.id = "pdfStage";
    document.body.appendChild(stage);
    var res = await paginateForPdf(buildDocParts(q), stage);
    var scale = (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth<=980) ? 2 : 3;
    var images = [];
    for(var i=0; i<res.pages.length; i++){
      setBusy(true, "Rendering page "+(i+1)+" of "+res.pages.length+"…");
      await new Promise(function(r){ setTimeout(r, 16); });
      images.push(await pdfRasterizeSafely(res.pages[i].page, scale));
    }
    var title = (q.quoteNo||"Quotation") + (q.customerName ? " – "+q.customerName : "");
    var blob = buildPdfFromJpegs(images, {title:title});
    var filename = (q.quoteNo||"quotation").replace(/[^a-z0-9\-_]+/gi,"_") + ".pdf";
    if(downloadsCap){
      try{ var r = await downloadsCap.save({filename:filename, data:blob}); toast(r.status==="saved" ? "PDF saved." : "PDF delivered."); }
      catch(err){ if(err && err.code==="declined"){} else { fallbackDownload(blob, filename, "PDF downloaded."); } }
    } else { fallbackDownload(blob, filename, "PDF downloaded."); }
    if(res.warn.clipped) setTimeout(function(){ toast("One description was too long for a page and was shortened in the PDF."); }, 2300);
  }catch(e){ console.error(e); toast("Couldn't generate the PDF. Try Print instead."); }
  finally{
    if(stage && stage.parentNode) stage.parentNode.removeChild(stage);
    setBusy(false); btn.disabled = false; btn.innerHTML = origLabel; pdfBusy = false;
  }
}
function fallbackDownload(blob, filename, doneMsg){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast(doneMsg || "Downloaded.");
}

/* ============================================================
   EXCEL EXPORT
   ============================================================ */
function excelAddImage(workbook, worksheet, dataUrl, range){
  if(!dataUrl || typeof dataUrl !== "string" || dataUrl.indexOf("data:image/") !== 0) return;
  try{
    var match = dataUrl.match(/^data:image\/(png|jpeg|jpg);base64,/i);
    if(!match) return;
    var extension = match[1].toLowerCase()==="jpg" ? "jpeg" : match[1].toLowerCase();
    var imageId = workbook.addImage({base64:dataUrl, extension:extension});
    worksheet.addImage(imageId, range);
  }catch(e){ console.warn("Could not embed image in Excel export.", e); }
}

/* Turn any picture the app can show (data: PNG/JPEG/GIF/WEBP, or a web address) into a PNG/JPEG data: URL the
   Excel file can hold. Returns "" when it can't be done (for example a web picture whose site doesn't allow
   downloading it, or no internet). kind "logo" keeps transparency (PNG); kind "photo" becomes a smaller JPEG. */
var EXCEL_IMG_MAX_PX = 1600;
function excelBlobToDataUrl(blob){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ resolve(String(fr.result||"")); };
    fr.onerror = function(){ reject(fr.error || new Error("read failed")); };
    fr.readAsDataURL(blob);
  });
}
function excelLoadImageEl(url){
  return new Promise(function(resolve, reject){
    var im = new Image();
    var timer = setTimeout(function(){ reject(new Error("image timeout")); }, 12000);
    im.onload = function(){ clearTimeout(timer); resolve(im); };
    im.onerror = function(){ clearTimeout(timer); reject(new Error("image failed")); };
    im.src = url;
  });
}
async function excelResolveImage(src, kind){
  try{
    src = String(src==null ? "" : src);
    if(!src || src.indexOf("PLACEHOLDER_LOGO_BASE64") !== -1) return "";
    var dataUrl = src;
    if(/^data:image\/(png|jpe?g);base64,/i.test(src)) return src;              /* already fine */
    if(!/^data:image\/(gif|webp);base64,/i.test(src)){
      if(!/^(https?:\/\/|\/)[^\s"'<>]+$/i.test(src)) return "";                  /* not an image address we trust */
      var ctrl = (typeof AbortController === "function") ? new AbortController() : null;
      var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 12000);
      var resp;
      try{ resp = await fetch(src, {mode:"cors", credentials:"omit", signal: ctrl ? ctrl.signal : undefined}); }
      finally{ clearTimeout(timer); }
      if(!resp || !resp.ok) return "";
      var blob = await resp.blob();
      if(blob.size > 25*1024*1024) return "";
      dataUrl = await excelBlobToDataUrl(blob);
      if(/^data:image\/(png|jpe?g);base64,/i.test(dataUrl)) return dataUrl;       /* web PNG/JPEG: use the bytes as they are */
      if(!/^data:image\//i.test(dataUrl)) return "";
      if(/^data:image\/svg/i.test(dataUrl)) return "";                            /* vector pictures are not supported */
    }
    /* GIF / WEBP / anything else the browser can draw: redraw it on a canvas */
    var el = await excelLoadImageEl(dataUrl);
    var w = el.naturalWidth || el.width, h = el.naturalHeight || el.height;
    if(!w || !h) return "";
    var sc = Math.min(1, EXCEL_IMG_MAX_PX / Math.max(w, h));
    var cw = Math.max(1, Math.round(w*sc)), ch = Math.max(1, Math.round(h*sc));
    var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
    var cx = cv.getContext("2d");
    if(kind === "logo"){ cx.drawImage(el, 0, 0, cw, ch); return cv.toDataURL("image/png"); }
    cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, cw, ch); cx.drawImage(el, 0, 0, cw, ch);
    return cv.toDataURL("image/jpeg", 0.88);
  }catch(e){ console.warn("Excel export: couldn't prepare a picture.", e); return ""; }
}

/* Rough text width in pixels (Arial), used to keep money columns wide enough so Excel never shows ##### */
function excelTextPx(str, pt){
  var px = 0, em = pt*96/72;
  String(str||"").split("").forEach(function(ch){
    if(ch >= "0" && ch <= "9") px += 0.556*em;
    else if(ch === "," || ch === "." || ch === " " || ch === ":") px += 0.30*em;
    else if(ch === "-") px += 0.34*em;
    else if(ch >= "A" && ch <= "Z") px += 0.70*em;
    else px += 0.58*em;
  });
  return px;
}

      {v:settings.phone||"", font:F(11, {color:{argb:"FF333333"}}), per:44, lh:14.5, min:19},
      {v:settings.email||"", font:F(11, {color:{argb:"FF333333"}}), per:44, lh:14.5, min:19},
      {v:settings.website||"", font:F(11, {color:{argb:"FF333333"}}), per:44, lh:14.5, min:19}
    ];
    hdr.forEach(function(h,i){
      var r = i+1;
      ws.mergeCells("D"+r+":F"+r);
      var c = ws.getCell("D"+r); c.value = h.v; c.font = h.font;
      c.alignment = {vertical:"middle", horizontal:"left", wrapText:true};
      ws.getRow(r).height = Math.max(h.min, xlLines(h.v, h.per)*h.lh + 5);
    });
    if(logoData) excelAddImage(wb, ws, logoData, {box:{c1:0,r1:0,c2:2,r2:5}, pad:4, align:"left"});

    /* ---- Quote meta (a heavy line above it, like the preview) ---- */
    var m0 = 8;
    for(var mi=0; mi<3; mi++){ ws.mergeCells("A"+(m0+mi)+":C"+(m0+mi)); }
    ws.mergeCells("D"+m0+":F"+m0);
    ws.mergeCells("D"+(m0+1)+":F"+(m0+2));
    ws.getCell("A"+m0).value = "Date: " + fmtDateHuman(q.date);
    ws.getCell("A"+(m0+1)).value = "Valid Until: " + fmtDateHuman(q.validUntil);
    ws.getCell("A"+(m0+2)).value = "Quotation No: " + (q.quoteNo||"");
    ws.getCell("D"+m0).value = "Customer Name: " + (q.customerName||"");
    ws.getCell("D"+(m0+1)).value = "Address: " + (q.address||"");
    ["A"+m0,"A"+(m0+1),"A"+(m0+2),"D"+m0,"D"+(m0+1)].forEach(function(a){ ws.getCell(a).font=fontNormal; ws.getCell(a).alignment={vertical:(a.charAt(0)==="D"&&a!=="D"+m0)?"top":"middle",horizontal:"left",wrapText:true}; });
    var heavy = {style:"medium", color:{argb:INK}};
    for(var hc=1; hc<=6; hc++){ ws.getCell(m0,hc).border = {top:heavy}; }
    var metaPer = Math.floor((W.pcs+W.unit+W.total)*7/7.9);
    ws.getRow(m0).height = Math.max(22, xlLines("Customer Name: "+(q.customerName||""), metaPer)*15.5+6);
    ws.getRow(m0+1).height = 21; ws.getRow(m0+2).height = 21;
    var addrNeed = xlLines("Address: "+(q.address||""), metaPer)*15.5+6;
    if(addrNeed > 42) ws.getRow(m0+1).height = 21 + (addrNeed-42);

    /* ---- Items table ---- */
    var headerRow = 12;
    ["No","Photos","Description","PCS","Unit Price","Total Price"].forEach(function(v,i){
      var c=ws.getCell(headerRow,i+1); c.value=v; c.font=F(13,{bold:true}); c.alignment=center; c.border=allBorder; c.fill=solid(C_HEAD);
    });
    ws.getRow(headerRow).height=28;
    ws.printTitlesRow = headerRow+":"+headerRow;

    var photoMinH = Math.round(((W.photo*7+5) - 8) * 0.75) + 12;      /* tall enough for a square picture */
    items.forEach(function(it,idx){
      var rowNo = headerRow + 1 + idx;
      var row = ws.getRow(rowNo);
      var qty = Math.max(0, Number(it.qty)||0), price = Math.max(0, Number(it.unitPrice)||0);
      var g = "D"+rowNo+"*E"+rowNo;
      var dv = Math.max(0, itemDiscountValue(it)), lf;
      if(dv <= 0) lf = "ROUND("+g+",2)";
      else if(itemDiscountType(it) === "flat") lf = "ROUND(MAX(0,"+g+"-MIN("+dv+","+g+")),2)";
      else lf = "ROUND("+g+"*(1-MIN("+dv+",100)/100),2)";
      row.getCell(1).value = idx+1;
      row.getCell(3).value = it.description||"";
      row.getCell(4).value = qty;
      row.getCell(5).value = price;
      row.getCell(6).value = {formula:lf, result:itemLineTotal(it)};
      row.height = Math.min(409, Math.max(photoMinH, xlLines(it.description, descLine)*15.5 + 12));
      for(var c=1;c<=6;c++){
        var cell = row.getCell(c);
        cell.font = fontNormal; cell.border = allBorder;
        cell.alignment = (c===1||c===2||c===4) ? center : {vertical:"middle", horizontal:c>=5?"right":"left", wrapText:true, indent:1};
      }
      row.getCell(1).fill = solid(C_TINT);
      row.getCell(5).fill = solid(C_TINT);
      row.getCell(5).numFmt = CUR_FMT;
      row.getCell(6).numFmt = CUR_FMT;
      if(photoData[idx]) excelAddImage(wb, ws, photoData[idx], {box:{c1:1,r1:rowNo-1,c2:1,r2:rowNo-1}, pad:4});
    });

    /* ---- Totals: labels in column E, values in column F; every figure is a live formula ---- */
    var firstItemRow = headerRow + 1, lastItemRow = headerRow + items.length;
    var totalStart = lastItemRow + 2;
    var rT = totalStart, rD = totalStart+1, rG = totalStart+2;
    var dType = quoteDiscountType(q), dVal = Math.max(0, quoteDiscountValue(q));
    var fSub = items.length ? "ROUND(SUM(F"+firstItemRow+":F"+lastItemRow+"),2)" : "0";
    var fDisc = dType === "flat" ? "ROUND(MIN("+dVal+",F"+rT+"),2)" : "ROUND(MIN(F"+rT+",F"+rT+"*MIN("+dVal+",100)/100),2)";
    var fGrand = "ROUND(MAX(0,F"+rT+"-F"+rD+"),2)";
    var totalRows = [
      {label:"Total:",       f:fSub,   v:t.sub,     fill:C_TOTAL, fmt:CUR_FMT},
      {label:"Discount:",    f:fDisc,  v:t.discAmt, fill:C_DISC,  fmt:DISC_FMT},
      {label:"Grand Total:", f:fGrand, v:t.grand,   fill:C_GRAND, fmt:CUR_FMT}
    ];
    totalRows.forEach(function(tr,i){
      var r = totalStart + i;
      ws.getRow(r).height = 26;
      var lc = ws.getCell(r,5), vc = ws.getCell(r,6);
      lc.value = tr.label; vc.value = {formula:tr.f, result:tr.v};
      [lc,vc].forEach(function(c){ c.font = F(i===2?14:13,{bold:true}); c.fill = solid(tr.fill); c.border = allBorder; });
      lc.alignment = {vertical:"middle", horizontal:"right", indent:1};
      vc.alignment = {vertical:"middle", horizontal:"right", indent:1};
      vc.numFmt = tr.fmt;
    });

    var sectionRow = totalStart + 4;
    var termsTitleRow = 0, bankStart = 0, bankEnd = 0, advRow = 0;
    var termList = (q.terms||[]).filter(function(x){return (x||"").trim();});
    if(termList.length){
      termsTitleRow = sectionRow;
      ws.mergeCells(sectionRow,1,sectionRow,6); ws.getCell(sectionRow,1).value="General Terms"; ws.getCell(sectionRow,1).font=F(13,{bold:true}); ws.getCell(sectionRow,1).alignment={vertical:"middle",horizontal:"left"}; ws.getRow(sectionRow).height=24;
      sectionRow++;
      termList.forEach(function(term){
        ws.mergeCells(sectionRow,1,sectionRow,6); ws.getCell(sectionRow,1).value="* " + term; ws.getCell(sectionRow,1).font=fontNormal; ws.getCell(sectionRow,1).alignment={vertical:"middle",horizontal:"left",wrapText:true};
        ws.getRow(sectionRow).height=Math.min(409, Math.max(22, xlLines("* "+term, fullLine)*15.5 + 7)); sectionRow++;
      });
    }

    if(q.showBank){
      var b=settings.bank||{};
      var fontBank = F(FS,{bold:true,color:{argb:C_RED}});       /* red and bold, like the preview */
      sectionRow++; bankStart = sectionRow;
      [["Account Name",b.accountName],["Account Number",b.accountNumber],["Bank",b.bankName],["Branch",b.branch]].forEach(function(pair){
        if(!pair[1]) return;
        ws.mergeCells(sectionRow,1,sectionRow,2); ws.mergeCells(sectionRow,3,sectionRow,6);
        ws.getCell(sectionRow,1).value=pair[0]; ws.getCell(sectionRow,3).value=": "+pair[1];
        ws.getCell(sectionRow,1).font=fontBank; ws.getCell(sectionRow,3).font=fontBank;
        ws.getCell(sectionRow,1).alignment={vertical:"middle",horizontal:"left"}; ws.getCell(sectionRow,3).alignment={vertical:"middle",horizontal:"left",wrapText:true};
        ws.getRow(sectionRow).height = Math.max(21, xlLines(": "+pair[1], Math.floor((W.desc+W.pcs+W.unit+W.total)*7/8.6))*16 + 5);
        sectionRow++;
      });
      bankEnd = sectionRow - 1;
    }
    if(q.showAdvance){
      var advPct = clamp(q.advancePct, 0, 100);
      sectionRow++; advRow = sectionRow;
      ws.mergeCells(sectionRow,3,sectionRow,5);
      ws.getCell(sectionRow,3).value="Required Advance:";
      ws.getCell(sectionRow,6).value={formula:"ROUND(F"+rG+"*"+advPct+"/100,2)", result:t.adv};
      ws.getCell(sectionRow,3).font=F(13,{bold:true}); ws.getCell(sectionRow,6).font=F(13,{bold:true});
      ws.getCell(sectionRow,3).alignment={vertical:"middle",horizontal:"right",indent:1}; ws.getCell(sectionRow,6).alignment={vertical:"middle",horizontal:"right",indent:1};
      ws.getCell(sectionRow,6).numFmt=CUR_FMT; ws.getRow(sectionRow).height=26; sectionRow++;
    }

    var footRow = sectionRow+1;
    ws.mergeCells(footRow,1,footRow,6);
    ws.getCell(footRow,1).value="Thank you for the opportunity to quote. This quotation is valid until " + fmtDateHuman(q.validUntil) + ".";
    ws.getCell(footRow,1).font=F(11,{italic:true,color:{argb:"FF9AA0AD"}});
    ws.getCell(footRow,1).alignment={vertical:"middle",horizontal:"center",wrapText:true};
    ws.getRow(footRow).height=28;

    var endRow=footRow;

    /* Keep blocks together when printed: if a block (the three totals, the "General Terms" heading with its first
       term, the bank details, the advance line with the footer) would be split by the end of a page, start a new page
       before it. Row heights are all fixed, so the page positions can be worked out here. */
    (function(){
      var colPx = [W.no,W.photo,W.desc,W.pcs,W.unit,W.total].reduce(function(s,w){ return s + Math.round(w*7+5); }, 0);
      var scale = Math.min(1, ((8.27-0.5)*96) / colPx);
      var capPt = ((11.69-0.9)*72)/scale - 8, titleH = ws.getRow(headerRow).height || 28;
      function rh(r){ var rw = ws.rows[r]; return (rw && rw.height) ? rw.height : 15; }
      var groups = {};
      function grp(a,b){ if(a>0 && b>=a) groups[a] = b; }
      grp(rT, rG); if(termsTitleRow) grp(termsTitleRow, termsTitleRow+1); grp(bankStart, bankEnd); grp(advRow, footRow);
      var y = 0, page = 1, breaks = [];
      for(var r=1; r<=endRow; r++){
        var h = rh(r), need = h;
        if(groups[r]){ need = 0; for(var k=r; k<=groups[r]; k++) need += rh(k); }
        var floor = page>1 ? titleH : 0;
        if(y + need > capPt && y > floor){
          if(groups[r] && need <= capPt - titleH) breaks.push(r-1);
          page++; y = titleH;
        }
        y += h;
      }
      if(breaks.length) ws.rowBreaks = breaks;
    })();
    for(var r=1;r<=endRow;r++){ for(var c=1;c<=6;c++){ if(!ws.getCell(r,c).font) ws.getCell(r,c).font=fontNormal; } }
    ws.pageSetup.printArea="A1:F"+endRow;
    ws.pageSetup.horizontalDpi=300; ws.pageSetup.verticalDpi=300;
    ws.headerFooter.oddFooter.center.text="Page &P of &N";
    ws.headerFooter.oddFooter.center.size=8;
    ws.headerFooter.oddFooter.center.font="Arial";

    var buffer = await wb.writeBuffer();
    var blob = new Blob([buffer], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var filename = (q.quoteNo||"quotation").replace(/[^a-z0-9\-_]+/gi,"_") + ".xlsx";
    if(downloadsCap){
      try{ var res = await downloadsCap.save({filename:filename, data:blob}); toast(res.status==="saved" ? "Excel saved." : "Excel delivered."); }
      catch(err){ if(err && err.code==="declined"){} else { excelBrowserDownload(blob, filename); } }
    } else { excelBrowserDownload(blob, filename); }
    if(skippedPics){
      setTimeout(function(){ toast(skippedPics + (skippedPics===1 ? " picture" : " pictures") + " couldn't be added to the Excel file (a web picture that can't be downloaded) and " + (skippedPics===1 ? "was" : "were") + " left blank."); }, 2300);
    }
  }catch(e){ console.error("Excel export failed:", e); toast("Couldn't generate the Excel file."); }
  finally{ btn.disabled = false; btn.innerHTML = origLabel; }
}
function excelBrowserDownload(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast("Excel downloaded.");
}
function doPrint(){
  var q = getCurrent();
  if(!q){ toast("Create a quotation first."); return; }
  if(window.innerWidth<=980) setMobileTab("preview");
  setTimeout(function(){ window.print(); }, 60);
}
async function exportAllData(){
  var clean = quotes.map(function(q){ var c = deepClone(q); delete c.starter; return c; });
  var payload = JSON.stringify({format:"quotation-builder-backup", version:2, exportedAt:new Date().toISOString(), settings:settings, quotes:clean}, null, 2);
  var blob = new Blob([payload], {type:"application/json"});
  var filename = "quotation-builder-backup-" + todayISO() + ".json";
  if(downloadsCap){
    try{ await downloadsCap.save({filename:filename, data:blob}); toast("Backup saved."); return; }
    catch(e){ if(e && e.code==="declined") return; }
  }
  fallbackDownload(blob, filename, "Backup downloaded.");
}
async function importBackup(file){
  var data;
  try{
    if(file.size > 80*1024*1024) throw new Error("too big");
    data = JSON.parse(await file.text());
  }catch(e){ toast("That file isn't a valid backup."); return; }
  var list = Array.isArray(data) ? data : (data && Array.isArray(data.quotes) ? data.quotes : null);
  if(!list){ toast("No quotations found in that file."); return; }
  var incoming = [];
  list.forEach(function(r){ var c = sanitizeQuote(r); if(c){ delete c.starter; incoming.push(c); } });
  if(!incoming.length){ toast("No quotations found in that file."); return; }
  var added = 0, replaced = 0, kept = 0;
  incoming.forEach(function(c){
    var l = quotes.find(function(x){ return x.id===c.id; });
    if(!l) added++; else if((c.updatedAt||0) > (l.updatedAt||0)) replaced++; else kept++;
  });
  var ok = await confirmDialog("Import backup?", added+" new, "+replaced+" replaced by the backup's newer copy, "+kept+" already up to date (left as they are).", "Import");
  if(!ok) return;
  incoming.forEach(function(c){
    var l = quotes.find(function(x){ return x.id===c.id; });
    if(!l){ delete tombstones[c.id]; quotes.push(c); pushQuoteToCloud(c); }
    else if((c.updatedAt||0) > (l.updatedAt||0)){ adoptRemote(l, c); pushQuoteToCloud(l); }
  });
  saveMapLS(LS_TOMBS, tombstones);
  var settingsNote = "";
  if(data && !Array.isArray(data) && data.settings && typeof data.settings==="object"){
    var bs = normalizeSettings(data.settings), cur = Number(settings.updatedAt)||0;
    if(!cur || (Number(bs.updatedAt)||0) > cur){
      bs.nextNumber = Math.max(Number(settings.nextNumber)||1, Number(bs.nextNumber)||1);
      settings = bs; persistSettings(); settingsNote = " Company details restored.";
    } else settingsNote = " Your current company details were kept.";
  }
  persistQuotesLocal();
  if(!getCurrent()) currentId = newestQuoteId();
  renderAll();
  toast("Imported "+(added+replaced)+" quotation"+((added+replaced)===1?"":"s")+"."+settingsNote);
}

/* ============================================================
   WIRE UP GLOBAL EVENTS
   ============================================================ */
function renderAll(){ renderSidebar(); renderEditor(); renderPreview(); renderDocTitleField(); }

document.getElementById("newQuoteBtn").addEventListener("click", createNewQuote);
document.getElementById("searchInput").addEventListener("input", renderSidebar);
document.getElementById("printBtn").addEventListener("click", doPrint);
document.getElementById("pdfBtn").addEventListener("click", exportPDF);
document.getElementById("excelBtn").addEventListener("click", exportExcel);
document.getElementById("settingsBtn").addEventListener("click", openCompanyModal);
document.getElementById("companySave").addEventListener("click", saveCompanyModal);
document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("scrim").addEventListener("click", closeSidebar);
document.getElementById("tabEdit").addEventListener("click", function(){ setMobileTab("edit"); });
document.getElementById("tabPreview").addEventListener("click", function(){ setMobileTab("preview"); });
document.getElementById("docTitleField").addEventListener("input", function(e){ var q = getCurrent(); if(!q) return; q.title = e.target.value; touchAndSave(q); renderSidebar(); });
document.getElementById("clearAllBtn").addEventListener("click", exportAllData);
document.getElementById("importBtn").addEventListener("click", function(){ document.getElementById("importInput").click(); });
document.getElementById("importInput").addEventListener("change", async function(e){ var f = e.target.files[0]; e.target.value = ""; if(f) await importBackup(f); });
window.addEventListener("pagehide", flushAll);
window.addEventListener("beforeunload", flushAll);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") flushAll(); });
window.addEventListener("online", function(){ refreshSyncPill(); if(dbCap){ if(cloudReady) retryFailed(); else connectCloud().then(function(){ if(cloudReady) afterCloudMerge(); }); } });
window.addEventListener("offline", refreshSyncPill);
document.getElementById("companyModal").addEventListener("click", function(e){ if(e.target===this) closeCompanyModal(); });
window.addEventListener("keydown", function(e){ if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="p"){ e.preventDefault(); doPrint(); } });

/* ============================================================
   INIT
   ============================================================ */
if(!quotes.length){
  var q0 = newQuoteFromSettings(settings);
  q0.starter = true;                 /* blank starter quotation: discarded automatically if the cloud already has data */
  quotes.push(q0);
  currentId = q0.id;
  persistQuotesLocal();
}
renderAll();
initCapabilities().then(function(){ afterCloudMerge(); });

})();
</script>
