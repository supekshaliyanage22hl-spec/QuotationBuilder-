<style>
/* ============ TOKENS ============ */
:root{
  --ink:#181a1f; --ink-soft:#565c69; --ink-faint:#8a90a0;
  --line:#e2e4ea; --line-soft:#edeef2;
  --surface:#ffffff; --canvas:#f3f4f7; --canvas-raised:#fafbfc;
  --amber:#c9820a; --amber-deep:#9c650a; --amber-wash:#fdf3e0; --amber-ink:#5c3f04;
  --danger:#c4402f; --danger-wash:#fbeae7; --good:#2c7a4b; --focus:#9c650a;
  --shadow-sm:0 1px 2px rgba(20,20,30,.06); --shadow-md:0 6px 20px rgba(20,20,30,.10); --shadow-lg:0 20px 48px rgba(20,20,30,.18);
  --radius:10px; --radius-sm:7px;
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box; padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f1f2f5; --ink-soft:#b8bcc8; --ink-faint:#767c8c; --line:#33353e; --line-soft:#2a2c34;
    --surface:#1c1e24; --canvas:#131418; --canvas-raised:#22242b;
    --amber:#e0a53a; --amber-deep:#f0b756; --amber-wash:#332405; --amber-ink:#f3cf8e;
    --danger:#e6685a; --danger-wash:#3a1f1c; --good:#57b783; --focus:#e0a53a;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 20px rgba(0,0,0,.45); --shadow-lg:0 20px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#f1f2f5; --ink-soft:#b8bcc8; --ink-faint:#767c8c; --line:#33353e; --line-soft:#2a2c34;
  --surface:#1c1e24; --canvas:#131418; --canvas-raised:#22242b;
  --amber:#e0a53a; --amber-deep:#f0b756; --amber-wash:#332405; --amber-ink:#f3cf8e;
  --danger:#e6685a; --danger-wash:#3a1f1c; --good:#57b783; --focus:#e0a53a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 20px rgba(0,0,0,.45); --shadow-lg:0 20px 48px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--canvas); color:var(--ink); font-family:var(--font-ui); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink);}
::selection{background:var(--amber-wash); color:var(--amber-ink);}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
img{max-width:100%;}
.scrollbar{scrollbar-width:thin; scrollbar-color:var(--line) transparent;}

/* ============ APP SHELL ============ */
#app{display:flex; flex-direction:column; height:100%; min-height:100vh;}
.topbar{display:flex; align-items:center; gap:12px; padding:10px 18px; padding-top:calc(10px + env(safe-area-inset-top,0px)); background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40; flex-wrap:wrap;}
.brandmark{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:-.01em; font-size:15px; white-space:nowrap;}
.brandmark .dot{width:9px; height:9px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 3px var(--amber-wash);}
.sync-pill{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; color:var(--ink-faint); padding:4px 9px; border-radius:999px; background:var(--canvas); white-space:nowrap;}
.sync-pill .sdot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none;}
.sync-pill.on{color:var(--good); background:#e8f5ee;}
.sync-pill.on .sdot{background:var(--good); box-shadow:0 0 0 3px rgba(44,122,75,.15);}
.sync-pill.off{color:var(--ink-faint);}
.sync-pill.busy{color:var(--amber-deep);}
.sync-pill.busy .sdot{background:var(--amber);}
.sync-pill.err{color:var(--danger); background:var(--danger-wash);}
.sync-pill.err .sdot{background:var(--danger);}
@media (prefers-color-scheme: dark){ .sync-pill.on{background:#12291d;} }
:root[data-theme="dark"] .sync-pill.on{background:#12291d;}
.topbar-spacer{flex:1;}
.doc-title-field{flex:1; min-width:0; max-width:320px; font-weight:600; font-size:14px; border:1px solid transparent; background:transparent; border-radius:var(--radius-sm); padding:7px 10px; color:var(--ink);}
.doc-title-field:hover{background:var(--canvas);}
.doc-title-field:focus{background:var(--canvas-raised); border-color:var(--line);}
.iconbtn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:34px; padding:0 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font-size:13px; font-weight:600; transition:background .12s, border-color .12s, transform .05s; white-space:nowrap;}
.iconbtn:hover{background:var(--canvas);}
.iconbtn:active{transform:translateY(1px);}
.iconbtn.primary{background:var(--amber); border-color:var(--amber); color:#241a02;}
.iconbtn.primary:hover{background:var(--amber-deep);}
.iconbtn.ghost{border-color:transparent; background:transparent;}
.iconbtn.ghost:hover{background:var(--canvas);}
.iconbtn.danger{color:var(--danger);}
.iconbtn:disabled{opacity:.4; cursor:not-allowed;}
.iconbtn svg{width:15px; height:15px; flex:none;}
.hide-sm{display:inline;}
@media (max-width:640px){ .hide-sm{display:none;} }

.shell-body{flex:1; display:flex; min-height:0;}
.sidebar{width:270px; flex:none; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0;}
.sidebar-head{padding:14px 14px 8px;}
.newquote-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:7px; padding:10px 12px; border-radius:var(--radius-sm); border:1px dashed var(--line); background:var(--canvas); color:var(--ink); font-weight:600; font-size:13px; cursor:pointer;}
.newquote-btn:hover{border-color:var(--amber); color:var(--amber-deep); background:var(--amber-wash);}
.search-row{padding:8px 14px;}
.search-row input{width:100%; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--canvas); color:var(--ink);}
.qlist{flex:1; overflow-y:auto; padding:4px 8px 14px;}
.qcard{position:relative; padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; margin:3px 0; border:1px solid transparent;}
.qcard:hover{background:var(--canvas);}
.qcard.active{background:var(--amber-wash); border-color:var(--amber);}
.qcard .qname{font-weight:600; font-size:13px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.qcard .qmeta{font-size:11.5px; color:var(--ink-faint); display:flex; justify-content:space-between; gap:6px;}
.qcard .qtotal{font-variant-numeric:tabular-nums;}
.qcard-actions{display:none; position:absolute; right:6px; top:6px; gap:2px;}
.qcard:hover .qcard-actions{display:flex;}
.qcard-actions button{width:22px; height:22px; border-radius:6px; border:none; background:var(--surface); box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
.qcard-actions button:hover{color:var(--danger);}
.empty-list{padding:26px 16px; text-align:center; color:var(--ink-faint); font-size:12.5px; white-space:pre-line;}
.sidebar-foot{padding:10px 14px; border-top:1px solid var(--line);}
.sidebar-foot .iconbtn{width:100%;}

.workarea{flex:1; min-width:0; display:flex; min-height:0;}
.pane{min-width:0; min-height:0; overflow-y:auto;}
.pane-editor{flex:1; max-width:580px; border-right:1px solid var(--line); background:var(--surface);}
.pane-preview{flex:1; background:var(--canvas); padding:28px 24px 60px;}
.mobiletabs{display:none; gap:4px; padding:8px 14px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;}
.mobiletabs button{flex:1; padding:9px 0; border-radius:8px; border:1px solid var(--line); background:var(--canvas); font-weight:600; font-size:13px; color:var(--ink-soft); cursor:pointer;}
.mobiletabs button.active{background:var(--amber); border-color:var(--amber); color:#241a02;}

/* ============ EDITOR FORM ============ */
.editor-inner{padding:20px 22px 90px;}
.section{margin-bottom:26px;}
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
.section-title{font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--ink-faint); text-transform:uppercase;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:10px;}
.field label{font-size:12px; font-weight:600; color:var(--ink-soft);}
.field input, .field textarea, .field select{padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--canvas-raised); color:var(--ink); width:100%;}
.field textarea{resize:vertical; min-height:56px; line-height:1.45;}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--amber); background:var(--surface);}
.hint{font-size:11.5px; color:var(--ink-faint);}
.logo-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.logo-preview{width:52px; height:52px; border-radius:9px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none;}
.logo-preview img{width:100%; height:100%; object-fit:contain;}
.filebtn{display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:12.5px; font-weight:600;}
.filebtn:hover{background:var(--canvas);}
.filebtn input{display:none;}

.item-card{border:1px solid var(--line); border-radius:var(--radius); background:var(--canvas-raised); padding:12px; margin-bottom:10px; position:relative;}
.item-top{display:flex; gap:10px; margin-bottom:9px;}
.item-photo{width:64px; height:64px; border-radius:8px; border:1px dashed var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; overflow:hidden; position:relative; color:var(--ink-faint);}
.item-photo:hover{border-color:var(--amber);}
.item-photo img{width:100%; height:100%; object-fit:cover;}
.item-photo svg{width:20px; height:20px;}
.item-photo .rm{position:absolute; top:2px; right:2px; width:16px; height:16px; background:rgba(0,0,0,.55); color:#fff; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px;}
.item-photo .spin{width:16px; height:16px; border:2px solid rgba(0,0,0,.15); border-top-color:var(--amber); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.item-desc{flex:1; min-width:0;}
.item-desc textarea{width:100%; min-height:64px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); resize:vertical;}
.item-nums{display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:end;}
.item-nums .field{margin-bottom:0;}
.item-nums input{padding:7px 9px;}
.item-total{font-size:12px; color:var(--ink-soft); text-align:right; font-variant-numeric:tabular-nums;}
.item-total b{color:var(--ink); font-size:13px;}
.disc-combo{display:flex; gap:6px;}
.disc-combo select{flex:0 0 58px; width:58px; padding:9px 4px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--canvas-raised); color:var(--ink); text-align:center;}
.disc-combo input{flex:1; min-width:0; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--canvas-raised); color:var(--ink);}
.disc-combo select:focus, .disc-combo input:focus{border-color:var(--amber); background:var(--surface);}
.item-remove{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-faint); flex:none;}
.item-remove:hover{color:var(--danger); border-color:var(--danger); background:var(--danger-wash);}
.add-item-btn{width:100%; padding:10px; border-radius:var(--radius-sm); border:1px dashed var(--line); background:transparent; color:var(--ink-soft); font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
.add-item-btn:hover{border-color:var(--amber); color:var(--amber-deep); background:var(--amber-wash);}

.totals-box{border:1px solid var(--line); border-radius:var(--radius); background:var(--canvas-raised); padding:12px 14px;}
.totals-line{display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:13px;}
.disc-label{display:flex; align-items:center; gap:6px;}
.disc-type-inline{padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--canvas-raised); color:var(--ink); font-size:12px; color-scheme:light dark;}
.totals-line input{width:80px; text-align:right; padding:5px 7px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--canvas-raised); color:var(--ink); color-scheme:light dark;}
.totals-line input:focus{border-color:var(--amber); background:var(--surface);}
.totals-line.grand{border-top:1px solid var(--line); margin-top:4px; padding-top:10px; font-weight:700; font-size:14.5px;}

.term-row{display:flex; gap:8px; align-items:flex-start; margin-bottom:7px;}
.term-row textarea{flex:1; min-height:44px; padding:7px 9px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--canvas-raised); resize:vertical;}
.term-row .item-remove{width:28px; height:28px; margin-top:2px;}
.add-term-btn{padding:7px 12px; border-radius:var(--radius-sm); border:1px dashed var(--line); background:transparent; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
.add-term-btn:hover{border-color:var(--amber); color:var(--amber-deep);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:2px 0 10px;}
.switch{position:relative; width:38px; height:22px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:999px; transition:.15s; cursor:pointer;}
.switch .track:before{content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.3);}
.switch input:checked + .track{background:var(--amber);}
.switch input:checked + .track:before{transform:translateX(16px);}

/* ============ PREVIEW / DOCUMENT — matches the Excel template ============ */
.preview-shell{max-width:850px; margin:0 auto;}
#docRoot{background:#ffffff; color:#161616; width:100%; max-width:820px; margin:0 auto; box-shadow:var(--shadow-lg); border-radius:2px; border:2px solid #161616; padding:34px 34px 30px; font-family:'Calibri','Inter',Arial,sans-serif;}

.doc-header{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px 18px; padding-bottom:14px;}
.doc-logo-block{display:flex; align-items:center; flex:0 1 auto; min-width:0;}
.doc-logo-block img{width:100%; max-width:280px; height:auto; display:block;}
.doc-titleblock{flex:1 1 200px; min-width:180px; max-width:330px; margin-left:auto; padding-top:2px; text-align:left; overflow-wrap:break-word;}
.doc-brand-name{font-weight:700; font-size:35px; line-height:1.25; color:#161616;}
.doc-brand-tag{font-weight:700; font-size:15px; color:#161616; margin-top:0;}
.doc-contact{margin-top:8px; font-size:13px; color:#161616; line-height:1.85;}
.doc-contact .cline{display:flex; align-items:center; gap:7px;}
.doc-cicon{width:15px; height:15px; border-radius:50%; background:var(--amber); flex:none; display:flex; align-items:center; justify-content:center;}
.doc-cicon svg{width:9px; height:9px; fill:#fff;}

.doc-meta{display:flex; justify-content:space-between; gap:24px; padding:14px 0 10px; font-size:12.5px; border-top:2px solid #161616; margin-top:4px;}
.doc-meta .col{flex:1;}
.doc-meta .row{display:flex; gap:6px; padding:2px 0;}
.doc-meta .lbl{color:#161616; min-width:96px;}
.doc-meta .val{color:#161616; font-weight:600;}
.doc-meta .col.right{text-align:left;}

table.doc-table{width:100%; border-collapse:collapse; margin-top:4px; font-size:13px; table-layout:fixed;}
table.doc-table col.c-no{width:6.5%;}
table.doc-table col.c-photo{width:18%;}
table.doc-table col.c-desc{width:29%;}
table.doc-table col.c-pcs{width:8%;}
table.doc-table col.c-unit{width:18.5%;}
table.doc-table col.c-total{width:20%;}
table.doc-table th, table.doc-table td{border:1px solid #b9bcc4; padding:7px 7px;}
table.doc-table thead th{background:#ffe699; color:#161616; text-align:center; font-weight:700; font-size:13.5px;}
td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
td.ctr{text-align:center;}
td.cell-tint-amber{background:#fff8e6;}
.doc-thumb-wrap{position:relative; width:100%; padding-top:100%; overflow:hidden; border-radius:2px;}
.doc-thumb{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block; border-radius:2px;}
.doc-thumb-empty{position:absolute; top:0; left:0; width:100%; height:100%; background:repeating-linear-gradient(45deg,#f4f4f6,#f4f4f6 6px,#eceef2 6px,#eceef2 12px); border-radius:2px;}
.desc-cell{font-weight:400; color:#161616; white-space:pre-wrap;}

.doc-totals-wrap{width:38.5%; margin-left:auto;}
.doc-totals{border-collapse:collapse; font-size:14px; margin-top:0; width:100%; table-layout:fixed;}
.doc-totals td{border:1px solid #b9bcc4; padding:6px 9px;}
.doc-totals tr.total-row td{background:#ffff00; font-weight:700;}
.doc-totals tr.disc-row td{background:#ff0000; color:#161616; font-weight:700;}
.doc-totals tr.grand-row td{background:#8fe28f; font-weight:700; font-size:15px;}
.doc-totals td.l{text-align:right; width:48.05%;}
.doc-totals td.v{text-align:right; width:51.95%; font-variant-numeric:tabular-nums;}

.doc-section{margin-top:22px;}
.doc-section-title{font-weight:700; font-size:14px; color:#161616; margin-bottom:6px;}
.doc-terms{list-style:none; margin:0; padding:0; font-size:13px; color:#161616; line-height:1.7;}
.doc-terms li{display:flex; gap:8px; padding:1px 0;}
.doc-terms li:before{content:"*"; color:#161616; flex:none; font-weight:700;}

.doc-bank{font-size:13px; color:#ff0000; font-weight:700; line-height:1.85;}
.doc-bank .row{display:flex;}
.doc-bank .lbl{min-width:150px;}
.doc-req-advance{margin-top:10px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; color:#161616;}
.doc-req-advance .v{font-size:15px;}

.doc-footer{margin-top:26px; padding-top:10px; border-top:1px solid #e5e6ea; font-size:11px; color:#9aa0ad; text-align:center;}

.empty-editor-state, .empty-preview-state{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:80px 30px; color:var(--ink-faint); gap:10px; height:100%;}
.empty-editor-state svg, .empty-preview-state svg{width:36px; height:36px; opacity:.5;}
.empty-editor-state h3{margin:0; color:var(--ink-soft); font-size:15px;}
.empty-editor-state p{margin:0; font-size:13px; max-width:280px;}

#toast{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(12px); background:var(--ink); color:var(--canvas); padding:10px 16px; border-radius:9px; font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:200; box-shadow:var(--shadow-md); max-width:88vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.modal-overlay{position:fixed; inset:0; background:rgba(10,10,14,.5); display:none; align-items:center; justify-content:center; z-index:300; padding:20px; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--surface); border-radius:var(--radius); max-width:360px; width:100%; padding:20px; box-shadow:var(--shadow-lg);}
.modal-box h3{margin:0 0 8px; font-size:15px;}
.modal-box p{margin:0 0 16px; font-size:13px; color:var(--ink-soft); line-height:1.5;}
.modal-actions{display:flex; gap:8px; justify-content:flex-end;}

@media (max-width:980px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:60; transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow-lg); padding-top:env(safe-area-inset-top,0px);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55;}
  .sidebar-scrim.show{display:block;}
  .mobiletabs{display:flex;}
  .workarea{flex-direction:column;}
  .pane-editor{max-width:none; border-right:none; display:none;}
  .pane-preview{padding:16px 10px 60px;}
  .pane-editor.active-mobile{display:block;}
  .pane-preview.active-mobile{display:block;}
  .pane-preview:not(.active-mobile){display:none;}
  #docRoot{padding:20px 16px 22px;}
  .field-row{grid-template-columns:1fr;}
  #docRoot .doc-header{flex-direction:column; gap:12px;}
  #docRoot .doc-logo-block img{width:190px;}
  #docRoot .doc-titleblock{max-width:none; margin-left:0; text-align:left;}
}
@media (min-width:981px){ .sidebar-scrim{display:none;} .menubtn{display:none;} }

@media print{
  @page{ size:A4; margin:9mm; }
  html,body{background:#fff !important; margin:0 !important; padding:0 !important; height:auto !important; overflow:visible !important;}
  #app{display:block !important; height:auto !important; min-height:0 !important; overflow:visible !important;}
  .topbar, .mobiletabs, .sidebar, .sidebar-scrim, #toast, .modal-overlay, .pane-editor{display:none !important;}
  .shell-body, .workarea{display:block !important; height:auto !important; min-height:0 !important;}
  .pane-preview{display:block !important; height:auto !important; overflow:visible !important; padding:0 !important; background:#fff !important;}
  .preview-shell{max-width:none !important; margin:0 !important;}
  #docRoot{width:100% !important; max-width:none !important; box-shadow:none !important; padding:16px !important; margin:0 !important; border-radius:0 !important; border:2px solid #161616 !important; -webkit-box-decoration-break:clone; box-decoration-break:clone;}
  table.doc-table{font-size:11.5pt;}
  table.doc-table thead{display:table-header-group;}
  .item-row-print{break-inside:avoid; page-break-inside:avoid;}
  .doc-totals-wrap{break-inside:avoid; page-break-inside:avoid;}
  .doc-keep-together{break-inside:avoid; page-break-inside:avoid;}
  .doc-header{break-inside:avoid; page-break-inside:avoid;}
}

/* ============ PDF pages (built off-screen, A4 at 96 dpi = 794 x 1123 px, independent of the window) ============ */
#pdfStage{position:absolute; left:0; top:0; width:794px; z-index:99990; background:#fff; pointer-events:none;}
.pdf-page{width:794px; height:1123px; box-sizing:border-box; padding:24px; background:#fff; position:relative; overflow:hidden;}
.pdf-frame{height:100%; box-sizing:border-box; border:2px solid #161616; padding:22px 24px 32px; position:relative; background:#fff; color:#161616; font-family:'Calibri','Inter',Arial,sans-serif;}
.pdf-content{height:100%; overflow:hidden;}
.pdf-pageno{position:absolute; left:0; right:0; bottom:9px; text-align:center; font-size:10.5px; color:#8a90a0;}
.busy-overlay{position:fixed; inset:0; z-index:99999; background:rgba(255,255,255,.88); background:color-mix(in srgb, var(--canvas) 88%, transparent); display:none; align-items:center; justify-content:center;}
.busy-overlay.show{display:flex;}
.busy-card{display:flex; align-items:center; gap:12px; background:var(--canvas-raised); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:16px 22px; font-weight:600; box-shadow:var(--shadow-lg);}
.busy-card .spin{width:18px; height:18px; border:2px solid rgba(0,0,0,.15); border-top-color:var(--amber); border-radius:50%; animation:spin .7s linear infinite;}
</style>
</head>

<script>
(function(){
"use strict";

/* ============================================================
   CONSTANTS / DEFAULTS
   ============================================================ */
/* No bundled logo: upload one in Company settings. (V12 shipped a literal placeholder
   string here which broke the Excel export.) */
var DEFAULT_LOGO = "";
var LS_SETTINGS = "qb_settings_v2";
var LS_QUOTES = "qb_quotes_v2";

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
/* Local-time date helpers. V12 used toISOString() (UTC), which returned the wrong day
   for users ahead of UTC (e.g. UTC+5:30) and made "valid N days" come out one day short. */
function pad2(n){ return (n<10?"0":"")+n; }
function isoFromLocalDate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayISO(){ return isoFromLocalDate(new Date()); }
function addDaysISO(iso, days){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  var d = m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date();
  d.setDate(d.getDate() + (Number(days)||0));
  return isoFromLocalDate(d);
}
function fmtDateHuman(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  if(!m) return "\u2014";
  var d = new Date(+m[1], +m[2]-1, +m[3]);
  if(isNaN(d) || d.getMonth()!==(+m[2]-1)) return "\u2014";
  var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
}
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function nl2br(s){ return escapeHtml(s).replace(/\n/g,"<br>"); }
/* Attribute-safe escaping (V12 only escaped double quotes, so "&amp;" typed by a user was corrupted
   on re-render and "<" / "&" could leak into markup). */
function esc(v){ return v==null? "": String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/'/g,"&#39;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* Only allow image sources we expect: inline data URIs, http(s) URLs and same-origin paths.
   Anything else (e.g. a crafted value from a shared database) renders as "no image". */
function imgSrc(u){
  u = String(u==null?"":u);
  if(!u || u.indexOf("PLACEHOLDER_LOGO_BASE64")!==-1) return "";
  if(/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/i.test(u) || /^https?:\/\/[^\s"'<>]+$/i.test(u) || /^\/[^\/\s"'<>][^\s"'<>]*$/.test(u)) return esc(u);
  return "";
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function round2(n){ n = Number(n)||0; return Math.round((n + (n<0?-1:1)*Number.EPSILON)*100)/100; }
function clamp(n, lo, hi){ n = Number(n); if(!isFinite(n)) n = 0; return Math.min(hi, Math.max(lo, n)); }
function normalizeCurrency(c){ var v = String(c==null?"":c).replace(/[<>&"'\\\u0000-\u001f]/g,"").trim().slice(0,8); return v || "LKR"; }

function defaultSettings(){
  return {
    companyName:"KITCHEN HUB",
    tagline:"EVERY MEAL, A CELEBRATION OF FLAVOR",
    subline:"Hotel & Restaurant Kitchen Equipment Supplier",
    address:"No: 149, Matara Road, Unawatuna, Galle",
    phone:"+94 76 487 5776 | +94 76 280 5776",
    email:"kitchenhubbranch@gmail.com",
    website:"www.kitchenhubb.lk",
    logo: DEFAULT_LOGO,
    currency:"LKR",
    defaultDiscountPct:5,
    defaultAdvancePct:65,
    showAdvanceByDefault:true,
    quotePrefix:"QT-",
    nextNumber:1,
    bank:{ accountName:"KitchenHub Smart Hotel Solutions (PVT) LTD", accountNumber:"111000352639", bankName:"NDB Bank", branch:"Gampaha" },
    defaultTerms:[
      "Advance payments are non-refundable under any circumstances, except in cases of delivery delays caused by us or unavailability of stock. An advance payment of 65% is required to confirm the order.",
      "Bank transfer or Card payment available."
    ],
    validDays:14,
    updatedAt:0
  };
}
function newItem(){ return { id: uid(), photo:"", description:"", qty:1, unitPrice:0, discountType:"pct", discountValue:0 }; }
/* Defensive clean-up for every quotation that enters the app (local storage, cloud, imported backups).
   Guarantees the shapes the rest of the code relies on and drops anything unsafe (e.g. odd image sources). */
function cleanStr(v, max){ return String(v==null?"":v).slice(0, max||2000); }
function cleanNum(v){ v = Number(v); return (isFinite(v) && v>0) ? v : 0; }
function isIsoDate(v){ return typeof v==="string" && /^\d{4}-\d{2}-\d{2}$/.test(v) && fmtDateHuman(v)!=="\u2014"; }
function sanitizeItem(raw){
  if(!raw || typeof raw!=="object") return null;
  var legacy = (raw.discountValue==null && raw.discountPct!=null) ? raw.discountPct : raw.discountValue;
  return {
    id: (typeof raw.id==="string" && /^[A-Za-z0-9_-]{1,64}$/.test(raw.id)) ? raw.id : uid(),
    photo: imgSrc(raw.photo) ? String(raw.photo) : "",
    description: cleanStr(raw.description, 50000),   /* generous: this only guards against absurd input, it must never cut real text */
    qty: cleanNum(raw.qty), unitPrice: cleanNum(raw.unitPrice),
    discountType: raw.discountType==="flat" ? "flat" : "pct",
    discountValue: cleanNum(legacy)
  };
}
function sanitizeQuote(raw, forcedId){
  if(!raw || typeof raw!=="object") return null;
  var id = forcedId || ((typeof raw.id==="string" && /^[A-Za-z0-9_-]{1,64}$/.test(raw.id)) ? raw.id : uid());
  var items = Array.isArray(raw.items) ? raw.items.slice(0,1000).map(sanitizeItem).filter(Boolean) : [];
  if(!items.length) items = [newItem()];
  var legacyDisc = (raw.discountValue==null && raw.discountPct!=null) ? raw.discountPct : raw.discountValue;
  var q = {
    id:id, title:cleanStr(raw.title,1000), quoteNo:cleanStr(raw.quoteNo,500),
    date: isIsoDate(raw.date) ? raw.date : todayISO(), validUntil: isIsoDate(raw.validUntil) ? raw.validUntil : "",
    customerName:cleanStr(raw.customerName,2000), address:cleanStr(raw.address,10000), items:items,
    discountType: raw.discountType==="flat" ? "flat" : "pct", discountValue: cleanNum(legacyDisc),
    advancePct: clamp(raw.advancePct,0,100), showAdvance: !!raw.showAdvance, showBank: raw.showBank!==false,
    terms: Array.isArray(raw.terms) ? raw.terms.slice(0,300).map(function(t){ return cleanStr(t,20000); }) : [],
    createdAt: cleanNum(raw.createdAt), updatedAt: cleanNum(raw.updatedAt)
  };
  if(raw.starter===true) q.starter = true;
  return q;
}
/* Quote numbers: the counter skips any number already in use, so a new quotation never reuses one. */
function quoteNoTaken(no){ return quotes.some(function(x){ return x.quoteNo===no; }); }
function allocateQuoteNo(){
  var n = Math.max(1, Number(settings.nextNumber)||1), no, guard = 0;
  do{ no = (settings.quotePrefix||"") + String(n).padStart(3,"0"); n++; guard++; } while(quoteNoTaken(no) && guard<100000);
  settings.nextNumber = n;
  persistSettingsLocal();
  pushCounterToCloud();
  return no;
}
function newQuoteFromSettings(s){
  return {
    id: uid(), title:"", quoteNo: allocateQuoteNo(), date: todayISO(), validUntil: addDaysISO(todayISO(), s.validDays||14),
    customerName:"", address:"", items:[newItem()],
    discountType:"pct", discountValue: s.defaultDiscountPct||0, advancePct: s.defaultAdvancePct||0,
    showAdvance: !!s.showAdvanceByDefault, showBank: true,
    terms: (s.defaultTerms||[]).slice(),
    createdAt: Date.now(), updatedAt: Date.now()
  };
}

/* ============================================================
   STATE
   ============================================================ */
var settings = loadSettingsLocal();
var quotes = loadQuotesLocal();
var currentId = quotes.length ? quotes[0].id : null;
var saveTimer = null;
var quoteWriteTimers = {};
var settingsWriteTimer = null;
var counterWriteTimer = null;

function normalizeSettings(remote){
  var d = defaultSettings();
  remote = (remote && typeof remote==="object") ? remote : {};
  var m = Object.assign(d, remote, {bank: Object.assign(d.bank, remote.bank||{})});
  m.currency = normalizeCurrency(m.currency);
  m.logo = imgSrc(m.logo) ? String(m.logo) : "";   /* drops the V12 placeholder + unsafe values */
  return m;
}
function loadSettingsLocal(){
  try{ var raw = localStorage.getItem(LS_SETTINGS); if(raw){ return normalizeSettings(JSON.parse(raw)); } }catch(e){}
  return normalizeSettings({});
}
function persistSettingsLocal(){ try{ localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); }catch(e){} }
function loadQuotesLocal(){
  try{
    var raw = localStorage.getItem(LS_QUOTES);
    if(raw){
      var arr = JSON.parse(raw), seen = {};
      if(Array.isArray(arr)) return arr.map(function(r){ return sanitizeQuote(r); }).filter(function(c){ if(!c || seen[c.id]) return false; seen[c.id]=1; return true; });
    }
  }catch(e){}
  return [];
}
function persistQuotesLocal(){ try{ localStorage.setItem(LS_QUOTES, JSON.stringify(quotes)); }catch(e){ toast("Local storage is full — try removing a photo or two."); } }
function getCurrent(){ for(var i=0;i<quotes.length;i++) if(quotes[i].id===currentId) return quotes[i]; return null; }

/* ============================================================
   CLOUD SYNC (db + assets capabilities)
   Rules:
   - Local storage is always written first (synchronously on exit), the cloud is best-effort + retried.
   - Connecting never throws local work away: quotations are merged by id, the newest edit wins.
   - A remote copy only replaces a local one when it is strictly newer, and it is applied IN PLACE so the
     editor never ends up holding a stale object.
   - Quote numbers live in their own document so editing company details can't overwrite the counter.
   ============================================================ */
var dbCap = null, assetsCap = null, downloadsCap = null;
var cloudReady = false;
var unsubQuotes = null, unsubSettings = null, unsubCounter = null;
var syncState = "off";            /* off | connecting | on */
var inflight = 0;
var failedQuoteIds = {}, failedSettings = false, failedCounter = false;
var retryTimer = null, bootRetryTimer = null, toastedSyncError = false;
var LS_SYNCED = "qb_synced_v1", LS_TOMBS = "qb_tombstones_v1";
function loadMapLS(key){ try{ var o = JSON.parse(localStorage.getItem(key)||"{}"); return (o && typeof o==="object" && !Array.isArray(o)) ? o : {}; }catch(e){ return {}; } }
function saveMapLS(key, map){ try{ localStorage.setItem(key, JSON.stringify(map)); }catch(e){} }
var syncedIds = loadMapLS(LS_SYNCED);   /* quote id -> updatedAt that the server is known to have */
var tombstones = loadMapLS(LS_TOMBS);   /* quote ids deleted here whose cloud delete is not confirmed yet */

function hasPendingWrites(){ return Object.keys(quoteWriteTimers).length>0 || !!settingsWriteTimer || !!counterWriteTimer; }
function hasFailures(){ return Object.keys(failedQuoteIds).length>0 || failedSettings || failedCounter || Object.keys(tombstones).length>0; }
function refreshSyncPill(){
  var pill = document.getElementById("syncPill"), label = document.getElementById("syncLabel");
  if(!pill || !label) return;
  pill.classList.remove("on","off","err","busy");
  if(!dbCap){ pill.classList.add("off"); label.textContent = "Local only"; return; }
  if(syncState==="connecting"){ label.textContent = "Connecting…"; return; }
  if(syncState==="off"){ pill.classList.add("off"); label.textContent = "Can't reach cloud — saved on this device"; return; }
  if(hasFailures() && Object.keys(failedQuoteIds).length+(failedSettings?1:0)+(failedCounter?1:0)>0){ pill.classList.add("err"); label.textContent = "Not synced — will retry"; return; }
  if(typeof navigator!=="undefined" && navigator.onLine===false){ pill.classList.add("off"); label.textContent = "Offline — saved on this device"; return; }
  if(inflight>0 || hasPendingWrites()){ pill.classList.add("busy"); label.textContent = "Saving…"; return; }
  pill.classList.add("on"); label.textContent = "Synced";
}
function setSyncStatus(state){ syncState = state; refreshSyncPill(); }

function onSyncFailure(){
  if(!toastedSyncError){ toastedSyncError = true; toast("Couldn't sync — saved on this device, will retry."); }
  clearTimeout(retryTimer); retryTimer = setTimeout(retryFailed, 15000);
  refreshSyncPill();
}
function retryFailed(){
  if(!dbCap || !cloudReady) return;
  var jobs = Object.keys(failedQuoteIds).map(writeQuoteNow);
  if(failedSettings) jobs.push(pushSettingsNow());
  if(failedCounter) jobs.push(pushCounterNow());
  flushTombstones();
  Promise.all(jobs).then(function(){
    if(hasFailures()){ clearTimeout(retryTimer); retryTimer = setTimeout(retryFailed, 30000); }
    else { toastedSyncError = false; refreshSyncPill(); }
  });
}

async function initCapabilities(){
  try{
    if(window.claude && window.claude.use){
      var results = await Promise.all([
        window.claude.use("db").catch(function(){return null;}),
        window.claude.use("assets").catch(function(){return null;}),
        window.claude.use("downloads").catch(function(){return null;})
      ]);
      dbCap = results[0]; assetsCap = results[1]; downloadsCap = results[2];
    }
  }catch(e){ dbCap = null; assetsCap = null; downloadsCap = null; }
  if(dbCap) await connectCloud(); else refreshSyncPill();
}
async function connectCloud(){
  if(!dbCap) return;
  clearTimeout(bootRetryTimer);
  setSyncStatus("connecting");
  try{
    await bootstrapCloud();
    cloudReady = true; setSyncStatus("on");
    flushTombstones();
  }catch(e){
    console.error("cloud connect failed", e);
    cloudReady = false; setSyncStatus("off");
    bootRetryTimer = setTimeout(function(){ connectCloud().then(function(){ if(cloudReady) afterCloudMerge(); }); }, 20000);
  }
}

function newestQuoteId(){
  var best = null;
  quotes.forEach(function(x){ if(!best || (x.updatedAt||0) > (best.updatedAt||0)) best = x; });
  return best ? best.id : null;
}
/* Replace the contents of `local` with `remote` but keep the same object, so existing references stay valid. */
function adoptRemote(local, remote){
  Object.keys(local).forEach(function(k){ delete local[k]; });
  Object.assign(local, deepClone(remote));
}
function duplicateNumberMap(){
  var m = {}; quotes.forEach(function(x){ if(x.quoteNo) m[x.quoteNo] = (m[x.quoteNo]||0)+1; }); return m;
}
function afterCloudMerge(){
  if(isEditorFocused()){ renderSidebar(); renderPreview(); } else renderAll();
  var d = duplicateNumberMap(), dup = Object.keys(d).some(function(k){ return d[k]>1; });
  if(dup) toast("Two quotations share the same number — look for ⚠ in the list.");
}

async function bootstrapCloud(){
  var settingsRef = dbCap.doc("settings/main"), counterRef = dbCap.doc("settings/counter");
  var results = await Promise.all([settingsRef.get(), counterRef.get()]);
  var sSnap = results[0], cSnap = results[1];

  /* --- settings: newest edit wins; the quote counter is merged separately (highest number wins) --- */
  var localNext = Math.max(1, Number(settings.nextNumber)||1);
  var remoteCounter = cSnap.exists ? (Number(cSnap.data().nextNumber)||0) : 0;
  var legacyNext = sSnap.exists ? (Number(sSnap.data().nextNumber)||0) : 0;
  var settingsLocalWins = false;
  if(!sSnap.exists){ settingsLocalWins = true; }
  else {
    var remoteSettings = normalizeSettings(sSnap.data());
    if((Number(settings.updatedAt)||0) > (Number(remoteSettings.updatedAt)||0)) settingsLocalWins = true;
    else settings = remoteSettings;
  }
  settings.nextNumber = Math.max(localNext, remoteCounter, legacyNext, 1);
  persistSettingsLocal();

  /* --- quotations: merge by id --- */
  var quotesCol = dbCap.collection("quotes");
  var qsnap = await quotesCol.get();
  var remote = {};
  qsnap.docs.forEach(function(d){ var c = sanitizeQuote(d.data(), d.id); if(c) remote[c.id] = c; });
  var hasRemote = Object.keys(remote).length > 0;
  Object.keys(tombstones).forEach(function(id){ delete remote[id]; });   /* deleted here while offline: never bring back */

  var merged = [], upload = [];
  quotes.forEach(function(l){
    if(tombstones[l.id]) return;
    var r = remote[l.id];
    if(r){
      var lu = l.updatedAt||0, ru = r.updatedAt||0;
      if(lu > ru) upload.push(l);
      else { if(ru > lu) adoptRemote(l, r); syncedIds[l.id] = l.updatedAt||0; }
      merged.push(l); delete remote[l.id];
    } else if(l.starter && hasRemote){
      /* untouched blank starter quotation on a device that already has cloud data: not worth keeping */
    } else if(syncedIds[l.id]!=null && (l.updatedAt||0) <= syncedIds[l.id]){
      /* it was on the server and unchanged since, but is gone now: deleted on another device */
    } else {
      merged.push(l); upload.push(l);                                  /* new here (or edited after the delete): keep + upload */
    }
  });
  Object.keys(remote).forEach(function(id){ merged.push(remote[id]); syncedIds[id] = remote[id].updatedAt||0; });
  quotes = merged;
  if(!quotes.length){ var q0 = newQuoteFromSettings(settings); quotes.push(q0); upload.push(q0); }
  if(!getCurrent()) currentId = newestQuoteId();
  saveMapLS(LS_SYNCED, syncedIds);
  persistQuotesLocal();

  var jobs = upload.map(function(x){ return writeQuoteNow(x.id); });
  if(settingsLocalWins) jobs.push(pushSettingsNow());
  if(settings.nextNumber > remoteCounter) jobs.push(pushCounterNow());
  await Promise.all(jobs);

  /* --- live updates --- */
  if(unsubSettings){ try{ unsubSettings(); }catch(e){} }
  if(unsubCounter){ try{ unsubCounter(); }catch(e){} }
  if(unsubQuotes){ try{ unsubQuotes(); }catch(e){} }

  unsubSettings = settingsRef.onSnapshot(function(snap){
    if(!snap.exists) return;
    var raw = snap.data(), r = normalizeSettings(raw);
    if((Number(r.updatedAt)||0) > (Number(settings.updatedAt)||0)){
      r.nextNumber = Math.max(Number(settings.nextNumber)||1, Number(raw.nextNumber)||0, 1);
      settings = r; persistSettingsLocal();
      renderSidebar(); renderPreview(); if(!isEditorFocused()) renderEditor();
    }
  }, function(err){ console.error("settings sync error", err); });

  unsubCounter = counterRef.onSnapshot(function(snap){
    if(!snap.exists) return;
    var n = Number(snap.data().nextNumber)||0;
    if(n > (Number(settings.nextNumber)||0)){ settings.nextNumber = n; persistSettingsLocal(); }
  }, function(err){ console.error("counter sync error", err); });

  unsubQuotes = quotesCol.onSnapshot(function(qs){
    var needSidebar = false, currentChanged = false, lostCurrent = false;
    qs.docChanges().forEach(function(ch){
      var id = ch.doc.id, idx = quotes.findIndex(function(x){ return x.id===id; });
      if(ch.type==="removed"){
        if(tombstones[id] || idx<0) return;
        var cur = quotes[idx];
        if((cur.updatedAt||0) > (syncedIds[id]||0)){ pushQuoteToCloud(cur); return; }   /* edited here after last sync: edit wins */
        quotes.splice(idx,1); delete syncedIds[id]; needSidebar = true;
        if(currentId===id){ currentId = newestQuoteId(); lostCurrent = true; }
        return;
      }
      if(tombstones[id]) return;
      var data = sanitizeQuote(ch.doc.data(), id);
      if(!data) return;
      if(idx<0){ quotes.push(data); syncedIds[id] = data.updatedAt||0; needSidebar = true; return; }
      var local = quotes[idx], ru = data.updatedAt||0, lu = local.updatedAt||0;
      if(ru > lu){
        adoptRemote(local, data); syncedIds[id] = ru; needSidebar = true;
        if(id===currentId) currentChanged = true;
      } else if(ru===lu){ syncedIds[id] = ru; }      /* echo of our own write: nothing to do */
    });
    saveMapLS(LS_SYNCED, syncedIds);
    persistQuotesLocal();
    if(lostCurrent){ renderAll(); toast("That quotation was deleted on another device."); }
    else {
      if(needSidebar) renderSidebar();
      if(currentChanged){ renderPreview(); renderDocTitleField(); if(!isEditorFocused()) renderEditor(); toast("Updated from another device."); }
    }
  }, function(err){ console.error("quotes sync error", err); });
}

function isEditorFocused(){
  var el = document.activeElement;
  var editor = document.getElementById("editorInner");
  return !!(el && editor && editor.contains(el));
}
function isCompanyModalOpen(){
  var m = document.getElementById("companyModal");
  return m && m.classList.contains("show");
}

function pushQuoteToCloud(q){
  if(!dbCap) return;
  var id = q.id;
  clearTimeout(quoteWriteTimers[id]);
  quoteWriteTimers[id] = setTimeout(function(){ delete quoteWriteTimers[id]; writeQuoteNow(id); }, 450);
  refreshSyncPill();
}
function writeQuoteNow(id){
  if(!dbCap) return Promise.resolve();
  var q = quotes.find(function(x){ return x.id===id; });
  if(!q || tombstones[id]) return Promise.resolve();
  var stamp = q.updatedAt||0, copy = deepClone(q);
  delete copy.starter;
  inflight++; refreshSyncPill();
  return Promise.resolve().then(function(){ return dbCap.collection("quotes").doc(id).set(copy); })
    .then(function(){ delete failedQuoteIds[id]; syncedIds[id] = Math.max(syncedIds[id]||0, stamp); saveMapLS(LS_SYNCED, syncedIds); })
    .catch(function(e){ console.error("quote write failed", e); failedQuoteIds[id] = true; onSyncFailure(); })
    .then(function(){ inflight--; refreshSyncPill(); });
}
function deleteQuoteFromCloud(id){
  tombstones[id] = Date.now(); saveMapLS(LS_TOMBS, tombstones);
  delete syncedIds[id]; saveMapLS(LS_SYNCED, syncedIds);
  clearTimeout(quoteWriteTimers[id]); delete quoteWriteTimers[id]; delete failedQuoteIds[id];
  flushTombstones();
}
function flushTombstones(){
  if(!dbCap || !cloudReady) return;
  Object.keys(tombstones).forEach(function(id){
    Promise.resolve().then(function(){ return dbCap.collection("quotes").doc(id).delete(); })
      .then(function(){ delete tombstones[id]; saveMapLS(LS_TOMBS, tombstones); refreshSyncPill(); })
      .catch(function(e){ console.error("quote delete failed", e); onSyncFailure(); });
  });
}
function pushSettingsToCloud(){
  if(!dbCap) return;
  clearTimeout(settingsWriteTimer);
  settingsWriteTimer = setTimeout(pushSettingsNow, 450);
  refreshSyncPill();
}
function pushSettingsNow(){
  clearTimeout(settingsWriteTimer); settingsWriteTimer = null;
  if(!dbCap) return Promise.resolve();
  var copy = deepClone(settings); delete copy.nextNumber;          /* the counter has its own document */
  inflight++; refreshSyncPill();
  return Promise.resolve().then(function(){ return dbCap.doc("settings/main").set(copy); })
    .then(function(){ failedSettings = false; })
    .catch(function(e){ console.error("settings write failed", e); failedSettings = true; onSyncFailure(); })
    .then(function(){ inflight--; refreshSyncPill(); });
}
function pushCounterToCloud(){
  if(!dbCap) return;
  clearTimeout(counterWriteTimer);
  counterWriteTimer = setTimeout(pushCounterNow, 200);
}
function pushCounterNow(){
  clearTimeout(counterWriteTimer); counterWriteTimer = null;
  if(!dbCap) return Promise.resolve();
  var n = Number(settings.nextNumber)||1;
  inflight++; refreshSyncPill();
  return Promise.resolve().then(function(){ return dbCap.doc("settings/counter").set({nextNumber:n, updatedAt:Date.now()}); })
    .then(function(){ failedCounter = false; })
    .catch(function(e){ console.error("counter write failed", e); failedCounter = true; onSyncFailure(); })
    .then(function(){ inflight--; refreshSyncPill(); });
}

/* Called after every edit to a quotation. Takes the quotation explicitly: it must never depend on which
   quotation happens to be open when an async step finishes. */
function touchAndSave(q){
  q = q || getCurrent();
  if(!q || quotes.indexOf(q)===-1) return;          /* deleted meanwhile: never resurrect it */
  q.updatedAt = Math.max(Date.now(), (q.updatedAt||0)+1);
  delete q.starter;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ saveTimer = null; persistQuotesLocal(); renderSidebar(); }, 220);
  pushQuoteToCloud(q);
}
function persistSettings(){ settings.updatedAt = Date.now(); persistSettingsLocal(); pushSettingsToCloud(); }

/* Leaving the page / hiding the tab: write everything now instead of waiting for the debounce timers. */
function flushAll(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  persistQuotesLocal(); persistSettingsLocal();
  Object.keys(quoteWriteTimers).forEach(function(id){ clearTimeout(quoteWriteTimers[id]); delete quoteWriteTimers[id]; writeQuoteNow(id); });
  if(settingsWriteTimer) pushSettingsNow();
  if(counterWriteTimer) pushCounterNow();
}

/* ============================================================
   IMAGE HELPERS
   ============================================================ */
function resizeImageFileToBlob(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w=img.width, h=img.height;
        var scale = Math.min(1, maxDim/Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement("canvas");
        canvas.width=cw; canvas.height=ch;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,cw,ch);
        canvas.toBlob(function(blob){ resolve({blob:blob, dataUrl:canvas.toDataURL("image/jpeg", quality||0.75)}); }, "image/jpeg", quality||0.75);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadPhotoFile(file, maxDim, quality){
  var made = await resizeImageFileToBlob(file, maxDim, quality);
  if(assetsCap){
    try{
      var res = await assetsCap.upload(made.blob);
      return res.url;
    }catch(e){ console.error("asset upload failed, falling back to inline image", e); }
  }
  return made.dataUrl;
}

   TOAST / MODAL
   ============================================================ */
var toastTimer=null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}
function confirmDialog(title, body, okLabel){
  return new Promise(function(resolve){
    var overlay = document.getElementById("confirmModal");
    document.getElementById("confirmTitle").textContent = title;
    document.getElementById("confirmBody").textContent = body;
    var okBtn = document.getElementById("confirmOk");
    okBtn.textContent = okLabel || "Delete";
    var isDanger = !okLabel || /delete/i.test(okLabel);          /* only real deletions look dangerous */
    okBtn.classList.toggle("danger", isDanger); okBtn.classList.toggle("primary", !isDanger);
    okBtn.style.borderColor = isDanger ? "var(--danger)" : "";
    overlay.classList.add("show");
    function cleanup(v){ overlay.classList.remove("show"); okBtn.removeEventListener("click", onOk); cancelBtn.removeEventListener("click", onCancel); resolve(v); }
    var cancelBtn = document.getElementById("confirmCancel");
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
  });
}

/* ============================================================
   CALCULATIONS
   ============================================================ */
function CUR(){ return escapeHtml(settings.currency); }
function money(n){ n = Number(n)||0; return n.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function quoteDiscountType(q){ return q.discountType === "flat" ? "flat" : "pct"; }
function quoteDiscountValue(q){ return (q.discountValue!=null) ? (Number(q.discountValue)||0) : (Number(q.discountPct)||0); }
function calcTotals(q){
  var sub = 0;
  (q.items||[]).forEach(function(it){ sub += itemLineTotal(it); });
  sub = round2(sub);
  var dval = Math.max(0, quoteDiscountValue(q));
  var discAmt = quoteDiscountType(q) === "flat" ? Math.min(dval, sub) : sub * Math.min(dval,100)/100;
  discAmt = round2(Math.min(discAmt, sub));
  var grand = round2(Math.max(0, sub - discAmt));
  var advPct = clamp(q.advancePct, 0, 100);
  var adv = round2(grand * advPct/100);
  return {sub:sub, discAmt:discAmt, grand:grand, adv:adv};
}

   RENDER: SIDEBAR
   ============================================================ */
function renderSidebar(){
  var list = document.getElementById("qList");
  var q = (document.getElementById("searchInput").value||"").toLowerCase().trim();
  var sorted = quotes.slice().sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
  var filtered = sorted.filter(function(item){
    if(!q) return true;
    var hay = (item.title+" "+item.quoteNo+" "+item.customerName).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
  if(!filtered.length){
    list.innerHTML = '<div class="empty-list">'+(quotes.length? "No quotations match your search.":"No quotations yet.\nClick “New quotation” to start.")+'</div>';
    return;
  }
  var html = "";
  filtered.forEach(function(item){
    var t = calcTotals(item);
    var active = item.id===currentId ? " active":"";
    html += '<div class="qcard'+active+'" data-id="'+escapeHtml(item.id)+'">'+
      '<div class="qname">'+escapeHtml(item.title || item.customerName || "Untitled quotation")+'</div>'+
      '<div class="qmeta"><span>'+escapeHtml(item.quoteNo||"")+(isDupNo(item)?' <span title="Another quotation has this number" style="color:var(--danger)">⚠</span>':'')+'</span><span class="qtotal">'+CUR()+' '+money(t.grand)+'</span></div>'+
      '<div class="qcard-actions">'+
        '<button data-act="dup" title="Duplicate"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>'+
        '<button data-act="del" title="Delete"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg></button>'+
      '</div>'+
    '</div>';
  });
  list.innerHTML = html;
  list.querySelectorAll(".qcard").forEach(function(el){
    el.addEventListener("click", function(e){
      if(e.target.closest("[data-act]")) return;
      currentId = el.getAttribute("data-id");
      renderAll();
      if(window.innerWidth <= 980){ closeSidebar(); setMobileTab("edit"); }
    });
  });
  list.querySelectorAll('[data-act="dup"]').forEach(function(btn){
    btn.addEventListener("click", function(e){ e.stopPropagation(); duplicateQuote(btn.closest(".qcard").getAttribute("data-id")); });
  });
  list.querySelectorAll('[data-act="del"]').forEach(function(btn){
    btn.addEventListener("click", async function(e){
      e.stopPropagation();
      var id = btn.closest(".qcard").getAttribute("data-id");
      var ok = await confirmDialog("Delete this quotation?", "This can't be undone.", "Delete");
      if(ok) deleteQuote(id);
    });
  });
}
function duplicateQuote(id){
  var src = quotes.find(function(x){return x.id===id;});
  if(!src) return;
  var copy = deepClone(src);
  copy.id = uid();
  copy.title = (src.title||"Untitled") + " (copy)";
  copy.quoteNo = allocateQuoteNo();
  delete copy.starter;
  copy.createdAt = Date.now(); copy.updatedAt = Date.now();
  quotes.push(copy);
  currentId = copy.id;
  persistQuotesLocal();
  pushQuoteToCloud(copy);
  renderAll();
  toast("Duplicated quotation.");
}
function deleteQuote(id){
  quotes = quotes.filter(function(x){return x.id!==id;});
  if(currentId===id) currentId = quotes.length? newestQuoteId() : null;
  persistQuotesLocal();
  deleteQuoteFromCloud(id);
  renderAll();
  toast("Quotation deleted.");
}

    '<div class="totals-box">'+
      '<div class="totals-line"><span>Subtotal</span><span id="t_sub">'+CUR()+' '+money(t.sub)+'</span></div>'+
      '<div class="totals-line"><span class="disc-label">Discount <select id="f_discountType" class="disc-type-inline">'+
          '<option value="pct"'+(quoteDiscountType(q)!=="flat"?" selected":"")+'>%</option>'+
          '<option value="flat"'+(quoteDiscountType(q)==="flat"?" selected":"")+'>'+CUR()+'</option>'+
        '</select></span><input id="f_discountValue" type="number" min="0" step="0.5" value="'+esc(quoteDiscountValue(q))+'"></div>'+
      '<div class="totals-line"><span>Discount amount</span><span id="t_discAmt">-'+CUR()+' '+money(t.discAmt)+'</span></div>'+
      '<div class="totals-line grand"><span>Grand total</span><span id="t_grand">'+CUR()+' '+money(t.grand)+'</span></div>'+
      '<div class="toggle-row" style="margin-top:10px;"><span style="font-size:12.5px; color:var(--ink-soft); font-weight:600;">Show required advance on document</span>'+ switchHtml("f_showAdvance", q.showAdvance) + '</div>'+
      (q.showAdvance ? (
        '<div class="totals-line"><span>Advance (%)</span><input id="f_advancePct" type="number" min="0" max="100" step="1" value="'+esc(q.advancePct)+'"></div>'+
        '<div class="totals-line"><span>Required advance</span><span id="t_adv">'+CUR()+' '+money(t.adv)+'</span></div>'
      ) : "") +
    '</div>'+
  '</div>';

  html += '<div class="section"><div class="section-head"><div class="section-title">Terms &amp; conditions</div></div>'+
    '<div id="termsWrap">'+ (q.terms||[]).map(function(term, idx){ return termRowHtml(term, idx); }).join("") +'</div>'+
    '<button class="add-term-btn" id="addTermBtn">+ Add term</button>'+
  '</div>';

  html += '<div class="section">'+
    '<div class="toggle-row" style="padding:0 0 6px;"><div class="section-title" style="text-transform:none; font-weight:700; font-size:12.5px; color:var(--ink);">Show bank details on document</div>'+ switchHtml("f_showBank", q.showBank) + '</div>'+
    (q.showBank ? bankFieldsHtml() : '<div class="hint">Bank details are hidden on this quotation. Edit them any time in Company settings.</div>') +
  '</div>';

  wrap.innerHTML = html;
  bindEditorEvents();
}

function isDupNo(q){ return !!q.quoteNo && quotes.some(function(x){ return x!==q && x.quoteNo===q.quoteNo; }); }
function updateDupHint(q){ var h = document.getElementById("noDupHint"); if(h) h.style.display = isDupNo(q) ? "" : "none"; }
function field(label, inner){ return '<div class="field">'+(label? '<label>'+escapeHtml(label)+'</label>':'')+inner+'</div>'; }
function inputText(id, val, ph){ return '<input id="'+id+'" type="text" value="'+esc(val)+'" placeholder="'+esc(ph||"")+'">'; }
function inputDate(id, val){ return '<input id="'+id+'" type="date" value="'+esc(val)+'">'; }
function textareaField(id, val, ph){ return '<textarea id="'+id+'" placeholder="'+esc(ph||"")+'">'+escapeHtml(val||"")+'</textarea>'; }
function switchHtml(id, checked){ return '<label class="switch"><input type="checkbox" id="'+id+'" '+(checked?"checked":"")+'><span class="track"></span></label>'; }
function bankFieldsHtml(){
  var b = settings.bank||{};
  return '<div class="hint" style="margin-bottom:8px;">Editing here updates your saved company bank details for everyone.</div>'+
    field("Account name", inputText("f_bankAccName", b.accountName)) +
    '<div class="field-row">'+ field("Account number", inputText("f_bankAccNo", b.accountNumber)) + field("Bank", inputText("f_bankName", b.bankName)) + '</div>'+
    field("Branch", inputText("f_bankBranch", b.branch));
}
function normaliseQuoteDiscount(q){
  var v = Math.max(0, Number(q.discountValue)||0);
  if(quoteDiscountType(q)==="pct") v = Math.min(100, v);
  q.discountValue = v;
}
function normaliseItemDiscount(it){
  var v = Math.max(0, Number(it.discountValue)||0);
  if(itemDiscountType(it)==="pct") v = Math.min(100, v);
  it.discountValue = v;
}
function itemDiscountType(it){ return it.discountType === "flat" ? "flat" : "pct"; }
function itemDiscountValue(it){ return (it.discountValue!=null) ? (Number(it.discountValue)||0) : (Number(it.discountPct)||0); }
function itemLineTotal(it){
  var qty = Math.max(0, Number(it.qty)||0), price = Math.max(0, Number(it.unitPrice)||0);
  var gross = qty * price;
  var dval = Math.max(0, itemDiscountValue(it));
  if(itemDiscountType(it) === "flat"){
    return round2(Math.max(0, gross - Math.min(dval, gross)));
  }
  return round2(gross * (1 - Math.min(dval,100)/100));
}
function itemCardHtml(it, idx){
  var lineTotal = itemLineTotal(it);
  return '<div class="item-card" data-idx="'+idx+'">'+
    '<div class="item-top">'+
      '<div class="item-photo" data-idx="'+idx+'" title="Click to add photo">'+
        (imgSrc(it.photo) ? ('<img src="'+imgSrc(it.photo)+'" alt=""><span class="rm" data-rmphoto="'+idx+'">✕</span>') : camSvg()) +
      '</div>'+
      '<div class="item-desc"><textarea data-field="description" data-idx="'+idx+'" placeholder="Item description">'+escapeHtml(it.description||"")+'</textarea></div>'+
      '<button class="item-remove" data-rmitem="'+idx+'" title="Remove item">'+trashSvg()+'</button>'+
    '</div>'+
    '<div class="item-nums">'+
      field("PCS", '<input type="number" min="0" step="1" inputmode="numeric" data-field="qty" data-idx="'+idx+'" value="'+esc(it.qty)+'">') +
      field("Unit price", '<input type="number" min="0" step="0.01" inputmode="decimal" data-field="unitPrice" data-idx="'+idx+'" value="'+esc(it.unitPrice)+'">') +
      field("Discount", '<div class="disc-combo">'+
        '<select data-field="discountType" data-idx="'+idx+'">'+
          '<option value="pct"'+(itemDiscountType(it)!=="flat"?" selected":"")+'>%</option>'+
          '<option value="flat"'+(itemDiscountType(it)==="flat"?" selected":"")+'>'+CUR()+'</option>'+
        '</select>'+
        '<input type="number" min="0" step="0.5" inputmode="decimal" data-field="discountValue" data-idx="'+idx+'" value="'+esc(itemDiscountValue(it))+'">'+
      '</div>') +
      field("", '<div class="item-total" data-item-total="'+idx+'">Line total<br><b>'+CUR()+' '+money(lineTotal)+'</b></div>') +
    '</div>'+
    '<input type="file" accept="image/*" capture="environment" style="display:none" data-fileinput="'+idx+'">'+
  '</div>';
}
function termRowHtml(term, idx){
  return '<div class="term-row" data-idx="'+idx+'"><textarea data-term-idx="'+idx+'">'+escapeHtml(term)+'</textarea><button class="item-remove" data-rmterm="'+idx+'">'+trashSvg()+'</button></div>';
}

function bindEditorEvents(){
  var q = getCurrent();
  if(!q) return;

  bindText("f_title", function(v){ q.title=v; });
  bindText("f_quoteNo", function(v){ q.quoteNo=v; updateDupHint(q); });
  bindText("f_date", function(v){ q.date=v; });
  bindText("f_validUntil", function(v){ q.validUntil=v; });
  bindText("f_customerName", function(v){ q.customerName=v; });
  bindText("f_address", function(v){ q.address=v; });
  var discTypeEl = document.getElementById("f_discountType");
  if(discTypeEl) discTypeEl.addEventListener("change", function(){ q.discountType=discTypeEl.value; normaliseQuoteDiscount(q); var dv=document.getElementById("f_discountValue"); if(dv) dv.value=q.discountValue; refreshComputedUI(q); });
  var discValEl = document.getElementById("f_discountValue");
  if(discValEl){
    discValEl.addEventListener("input", function(){ q.discountValue=Math.max(0, parseFloat(discValEl.value)||0); refreshComputedUI(q); });
    discValEl.addEventListener("change", function(){ normaliseQuoteDiscount(q); discValEl.value = q.discountValue; refreshComputedUI(q); });
  }
  var advPctEl = document.getElementById("f_advancePct");
  if(advPctEl){
    advPctEl.addEventListener("input", function(){ q.advancePct=clamp(parseFloat(advPctEl.value)||0, 0, 100); refreshComputedUI(q); });
    advPctEl.addEventListener("change", function(){ advPctEl.value = q.advancePct; });
  }

  var showAdv = document.getElementById("f_showAdvance");
  if(showAdv) showAdv.addEventListener("change", function(){ q.showAdvance=showAdv.checked; commit(true); });
  var showBank = document.getElementById("f_showBank");
  if(showBank) showBank.addEventListener("change", function(){ q.showBank=showBank.checked; commit(true); });

  bindText("f_bankAccName", function(v){ settings.bank.accountName=v; persistSettings(); }, true, true);
  bindText("f_bankAccNo", function(v){ settings.bank.accountNumber=v; persistSettings(); }, true, true);
  bindText("f_bankName", function(v){ settings.bank.bankName=v; persistSettings(); }, true, true);
  bindText("f_bankBranch", function(v){ settings.bank.branch=v; persistSettings(); }, true, true);

  document.getElementById("addItemBtn").addEventListener("click", function(){ q.items.push(newItem()); commit(true); });
  document.querySelectorAll('[data-rmitem]').forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-rmitem"),10);
      q.items.splice(idx,1);
      if(!q.items.length) q.items.push(newItem());
      commit(true);
    });
  });
  document.querySelectorAll('[data-rmphoto]').forEach(function(btn){
    btn.addEventListener("click", function(e){ e.stopPropagation(); q.items[parseInt(btn.getAttribute("data-rmphoto"),10)].photo=""; commit(true); });
  });
  document.querySelectorAll('.item-photo').forEach(function(el){
    el.addEventListener("click", function(){
      var input = document.querySelector('[data-fileinput="'+el.getAttribute("data-idx")+'"]');
      if(input) input.click();
    });
  });
  document.querySelectorAll('[data-fileinput]').forEach(function(input){
    input.addEventListener("change", async function(){
      var idx = parseInt(input.getAttribute("data-fileinput"),10);
      var file = input.files[0];
      if(!file) return;
      var item = q.items[idx]; if(!item) return;
      var itemId = item.id;                                   /* identify the item by id: the list may change while uploading */
      var photoEl = document.querySelector('.item-photo[data-idx="'+idx+'"]');
      var prevHtml = photoEl ? photoEl.innerHTML : "";
      if(photoEl) photoEl.innerHTML = '<span class="spin"></span>';
      try{
        var url = await uploadPhotoFile(file, 480, 0.75);
        if(quotes.indexOf(q)===-1) return;                    /* quotation was deleted while uploading */
        var target = q.items.find(function(i){ return i.id===itemId; });
        if(!target){ toast("That item was removed before its photo finished uploading."); if(q.id===currentId) renderEditor(); return; }
        target.photo = url;
        commit(true);                                         /* saves THIS quotation, even if another one is open now */
      }catch(e){ toast("Couldn't read that image."); if(photoEl && document.body.contains(photoEl)) photoEl.innerHTML = prevHtml; }
    });
  });
  document.querySelectorAll('[data-field="description"]').forEach(function(el){ el.addEventListener("input", function(){ q.items[parseInt(el.getAttribute("data-idx"),10)].description = el.value; commit(); }); });
  document.querySelectorAll('[data-field="qty"]').forEach(function(el){ el.addEventListener("input", function(){ var idx=parseInt(el.getAttribute("data-idx"),10); q.items[idx].qty = Math.max(0, parseFloat(el.value)||0); refreshComputedUI(q, idx); }); el.addEventListener("change", function(){ var idx=parseInt(el.getAttribute("data-idx"),10); el.value = q.items[idx].qty; }); });
  document.querySelectorAll('[data-field="unitPrice"]').forEach(function(el){ el.addEventListener("input", function(){ var idx=parseInt(el.getAttribute("data-idx"),10); q.items[idx].unitPrice = Math.max(0, parseFloat(el.value)||0); refreshComputedUI(q, idx); }); el.addEventListener("change", function(){ var idx=parseInt(el.getAttribute("data-idx"),10); el.value = q.items[idx].unitPrice; }); });
  document.querySelectorAll('[data-field="discountType"]').forEach(function(el){ el.addEventListener("change", function(){ var idx=parseInt(el.getAttribute("data-idx"),10); q.items[idx].discountType = el.value; normaliseItemDiscount(q.items[idx]); var dv=document.querySelector('[data-field="discountValue"][data-idx="'+idx+'"]'); if(dv) dv.value=q.items[idx].discountValue; refreshComputedUI(q, idx); }); });
  document.querySelectorAll('[data-field="discountValue"]').forEach(function(el){ el.addEventListener("input", function(){ var idx=parseInt(el.getAttribute("data-idx"),10); q.items[idx].discountValue = Math.max(0, parseFloat(el.value)||0); refreshComputedUI(q, idx); }); el.addEventListener("change", function(){ var idx=parseInt(el.getAttribute("data-idx"),10); normaliseItemDiscount(q.items[idx]); el.value = q.items[idx].discountValue; refreshComputedUI(q, idx); }); });

  document.getElementById("addTermBtn").addEventListener("click", function(){ q.terms = q.terms||[]; q.terms.push(""); commit(true); });
  document.querySelectorAll('[data-term-idx]').forEach(function(el){ el.addEventListener("input", function(){ q.terms[parseInt(el.getAttribute("data-term-idx"),10)] = el.value; commit(); }); });
  document.querySelectorAll('[data-rmterm]').forEach(function(btn){ btn.addEventListener("click", function(){ q.terms.splice(parseInt(btn.getAttribute("data-rmterm"),10),1); commit(true); }); });

  function refreshComputedUI(q, itemIdx){
    if(typeof itemIdx === "number"){
      var it = q.items[itemIdx];
      var totalEl = document.querySelector('[data-item-total="'+itemIdx+'"]');
      if(totalEl) totalEl.innerHTML = "Line total<br><b>"+CUR()+" "+money(itemLineTotal(it))+"</b>";
    }
    var t = calcTotals(q);
    var subEl = document.getElementById("t_sub"); if(subEl) subEl.textContent = settings.currency+" "+money(t.sub);
    var discAmtEl = document.getElementById("t_discAmt"); if(discAmtEl) discAmtEl.textContent = "-"+settings.currency+" "+money(t.discAmt);
    var grandEl = document.getElementById("t_grand"); if(grandEl) grandEl.textContent = settings.currency+" "+money(t.grand);
    var advEl = document.getElementById("t_adv"); if(advEl) advEl.textContent = settings.currency+" "+money(t.adv);
    touchAndSave(q);
    renderPreview();
    renderSidebar();
  }
  function bindText(id, setter, isNumberLike, skipRerender){
    var el = document.getElementById(id);
    if(!el) return;
    el.addEventListener("input", function(){ setter(el.value); commit(skipRerender ? false : (isNumberLike ? true : false), skipRerender); });
  }
  function commit(needsFullRerender, skipEditorRerender){
    touchAndSave(q);
    renderDocTitleField();
    renderPreview();
    if(needsFullRerender && !skipEditorRerender){
      var scrollY = document.getElementById("paneEditor").scrollTop;
      renderEditor();
      document.getElementById("paneEditor").scrollTop = scrollY;
    }
  }
}

function renderDocTitleField(){
  var f = document.getElementById("docTitleField");
  var q = getCurrent();
  f.value = q ? (q.title||"") : "";
  f.disabled = !q;
}

function pinIconSvg(){ return '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>'; }
function phoneIconSvg(){ return '<svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.6c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1L6.6 10.8z"/></svg>'; }
function mailIconSvg(){ return '<svg viewBox="0 0 24 24"><path d="M3 5.5A1.5 1.5 0 014.5 4h15A1.5 1.5 0 0121 5.5v13a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18.5v-13zM5 6l7 5 7-5"/></svg>'; }
function webIconSvg(){ return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.9 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.9-3.8-9S9.5 5.7 12 3z" fill="none" stroke="#fff" stroke-width="1.4"/></svg>'; }

/* The document is built from "parts" so the on-screen preview and the paginated PDF use exactly the same markup. */
function buildDocParts(q){
  var t = calcTotals(q), P = {};
  P.rows = (q.items||[]).map(function(it, idx){
    var lineTotal = itemLineTotal(it);
    return '<tr class="item-row-print">'+
      '<td class="ctr cell-tint-amber">'+(idx+1)+'</td>'+
      '<td>'+ '<div class="doc-thumb-wrap">'+ (imgSrc(it.photo) ? '<img class="doc-thumb" src="'+imgSrc(it.photo)+'" alt="">' : '<div class="doc-thumb-empty"></div>') +'</div>'+'</td>'+
      '<td class="desc-cell">'+nl2br(it.description||"")+'</td>'+
      '<td class="ctr">'+ (Number(it.qty)||0) +'</td>'+
      '<td class="num cell-tint-amber">'+CUR()+' '+money(it.unitPrice)+'</td>'+
      '<td class="num">'+CUR()+' '+money(lineTotal)+'</td>'+
    '</tr>';
  });
  P.termItems = (q.terms||[]).filter(function(x){return (x||"").trim();}).map(function(x){ return '<li>'+escapeHtml(x)+'</li>'; });
  P.termsSection = function(items, cont){ return '<div class="doc-section"><div class="doc-section-title">General Terms'+(cont?' (continued)':'')+'</div><ul class="doc-terms">'+items.join("")+'</ul></div>'; };

  P.header = '<div class="doc-header">'+
    '<div class="doc-logo-block">'+ (imgSrc(settings.logo) ? '<img src="'+imgSrc(settings.logo)+'" alt="Logo">' : '') + '</div>'+
    '<div class="doc-titleblock">'+
      '<div class="doc-brand-name">'+escapeHtml(settings.companyName||"")+'</div>'+
      (settings.subline ? '<div class="doc-brand-tag" style="font-weight:400; font-size:17px; color:#555;">'+escapeHtml(settings.subline)+'</div>' : '') +
      '<div class="doc-contact">'+
        (settings.address? '<div class="cline"><span class="doc-cicon">'+pinIconSvg()+'</span>'+escapeHtml(settings.address)+'</div>':'') +
        (settings.phone? '<div class="cline"><span class="doc-cicon">'+phoneIconSvg()+'</span>'+escapeHtml(settings.phone)+'</div>':'') +
        (settings.email? '<div class="cline"><span class="doc-cicon">'+mailIconSvg()+'</span>'+escapeHtml(settings.email)+'</div>':'') +
        (settings.website? '<div class="cline"><span class="doc-cicon">'+webIconSvg()+'</span>'+escapeHtml(settings.website)+'</div>':'') +
      '</div>'+
    '</div>'+
  '</div>';

  P.meta = '<div class="doc-meta">'+
    '<div class="col">'+
      '<div class="row"><span class="lbl">Date</span><span class="val">: '+fmtDateHuman(q.date)+'</span></div>'+
      '<div class="row"><span class="lbl">Valid Until</span><span class="val">: '+fmtDateHuman(q.validUntil)+'</span></div>'+
      '<div class="row"><span class="lbl">Quotation No</span><span class="val">: '+escapeHtml(q.quoteNo||"")+'</span></div>'+
    '</div>'+
    '<div class="col right">'+
      '<div class="row"><span class="lbl">Customer Name</span><span class="val">: '+escapeHtml(q.customerName||"")+'</span></div>'+
      '<div class="row"><span class="lbl">Address</span><span class="val">: '+escapeHtml(q.address||"")+'</span></div>'+
    '</div>'+
  '</div>';

  P.colgroup = '<colgroup><col class="c-no"><col class="c-photo"><col class="c-desc"><col class="c-pcs"><col class="c-unit"><col class="c-total"></colgroup>';
  P.thead = '<thead><tr><th>No</th><th>Photos</th><th>Description</th><th>PCS</th><th>Unit Price</th><th>Total Price</th></tr></thead>';

  P.totals = '<div class="doc-totals-wrap"><table class="doc-totals">'+
    '<tr class="total-row"><td class="l">Total:</td><td class="v">'+CUR()+' '+money(t.sub)+'</td></tr>'+
    '<tr class="disc-row"><td class="l">Discount:</td><td class="v">-'+CUR()+' '+money(t.discAmt)+'</td></tr>'+
    '<tr class="grand-row"><td class="l">Grand Total:</td><td class="v">'+CUR()+' '+money(t.grand)+'</td></tr>'+
  '</table></div>';

  P.bank = "";
  if(q.showBank){
    var b = settings.bank||{};
    P.bank = '<div class="doc-section"><div class="doc-bank">'+
      rowKV("Account Name", b.accountName)+ rowKV("Account Number", b.accountNumber)+ rowKV("Bank", b.bankName)+ rowKV("Branch", b.branch)+
    '</div>'+
    (q.showAdvance ? '<div class="doc-req-advance"><span>Required Advance :</span><span class="v">'+CUR()+' '+money(t.adv)+'</span></div>' : '') +
    '</div>';
  } else if(q.showAdvance){
    P.bank = '<div class="doc-section"><div class="doc-req-advance"><span>Required Advance :</span><span class="v">'+CUR()+' '+money(t.adv)+'</span></div></div>';
  }
  P.footer = '<div class="doc-footer">Thank you for the opportunity to quote. This quotation is valid until '+fmtDateHuman(q.validUntil)+'.</div>';
  return P;
}
function renderPreview(){
  var root = document.getElementById("docRoot");
  var q = getCurrent();
  if(!q){
    root.innerHTML = '<div class="empty-preview-state">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/></svg>'+
      '<h3 style="margin:0; color:var(--ink-soft); font-size:15px;">Nothing to preview yet</h3>'+
      '<p style="margin:0; font-size:13px;">Create a quotation to see the printable document here.</p></div>';
    return;
  }
  var P = buildDocParts(q);
  root.innerHTML = P.header + P.meta +
    '<table class="doc-table">'+P.colgroup+P.thead+'<tbody>'+P.rows.join("")+'</tbody></table>'+
    P.totals +
    '<div class="doc-keep-together">' + (P.termItems.length ? P.termsSection(P.termItems,false) : '') + P.bank + P.footer + '</div>';
}
function rowKV(k,v){ if(!v) return ""; return '<div class="row"><span class="lbl">'+escapeHtml(k)+'</span><span>: '+escapeHtml(v)+'</span></div>'; }

function openCompanyModal(){

  form.innerHTML =
    '<div class="logo-row"><div class="logo-preview" id="logoPreview">'+(imgSrc(settings.logo)? '<img src="'+imgSrc(settings.logo)+'" alt="">':'')+'</div>'+

    field("Address", inputText("cs_address", settings.address)) +
